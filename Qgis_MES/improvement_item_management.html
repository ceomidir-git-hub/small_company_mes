<!DOCTYPE html>
<html lang="ko" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개선항목관리 | HeatPro MES</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --line: #cfd6e1;
      --text: #1f2937;
      --muted: #64748b;
      --blue: #1f5edb;
      --blue-dark: #1647ad;
      --green: #079660;
      --green-dark: #05784d;
      --red: #dc2f45;
      --red-dark: #b91f34;
      --orange: #e38b20;
      --shadow: 0 3px 12px rgba(15, 23, 42, 0.06);
      --radius: 9px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    html.auth-pending body { visibility: hidden; }

    button,
    input,
    select { font: inherit; }

    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.48; }

    .page {
      width: 100%;
      margin: 0 auto;
      padding: 12px;
    }

    .title-frame {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .title-area h1 {
      margin: 0;
      color: #0e3f9d;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .file-name {
      margin-left: 5px;
      color: #667085;
      font-size: 12px;
      font-weight: 400;
    }

    .subtitle {
      margin-top: 5px;
      color: #5f6b7a;
      font-size: 12px;
    }

    .main-button {
      min-width: 112px;
      height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .main-button:hover { background: #f8fafc; }

    .search-frame {
      display: grid;
      grid-template-columns: minmax(180px, 250px) minmax(260px, 420px) auto;
      align-items: end;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      color: #445267;
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #c7d0dc;
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(31, 94, 219, 0.12);
    }

    .field input:disabled,
    .field select:disabled {
      background: #f1f5f9;
      color: #64748b;
    }

    .search-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      min-height: 40px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #1f2937;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .btn:hover { filter: brightness(0.97); }
    .btn-blue { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn-blue:hover { background: var(--blue-dark); }
    .btn-green { border-color: var(--green); background: var(--green); color: #fff; }
    .btn-green:hover { background: var(--green-dark); }
    .btn-red { border-color: var(--red); background: var(--red); color: #fff; }
    .btn-red:hover { background: var(--red-dark); }
    .btn-orange { border-color: var(--orange); background: var(--orange); color: #fff; }

    .action-frame {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
    }

    .guide-text { color: #617087; font-size: 12px; }

    .action-buttons {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .editor-frame {
      display: none;
      margin-bottom: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .editor-frame.show { display: block; }

    .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .editor-head h2 {
      margin: 0;
      color: #0e3f9d;
      font-size: 17px;
    }

    .mode-badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: #e9eef7;
      color: #45556d;
      font-size: 11px;
      font-weight: 800;
    }

    .mode-badge.new { background: #e6f7ef; color: #047857; }
    .mode-badge.edit { background: #fff3df; color: #a35405; }

    .editor-grid {
      display: grid;
      grid-template-columns: 0.7fr 1.4fr repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .list-frame {
      padding: 14px 16px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .list-title {
      margin: 2px 0 12px;
      color: #0e3f9d;
      font-size: 18px;
      text-align: center;
    }

    .table-wrap {
      width: 100%;
      max-height: 580px;
      overflow: auto;
      border: 1px solid #cbd5e1;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1260px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 10px 8px;
      border-right: 1px solid #1248a9;
      border-bottom: 1px solid #1248a9;
      background: #1e5bd7;
      color: #fff;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }

    tbody td,
    tfoot td {
      padding: 9px 8px;
      border-right: 1px solid #d8dee8;
      border-bottom: 1px solid #d8dee8;
      text-align: center;
      vertical-align: middle;
      word-break: keep-all;
    }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f5f8fd; }
    tbody tr.selected {
      background: #e8f0ff;
      outline: 2px solid rgba(31, 94, 219, 0.28);
      outline-offset: -2px;
    }

    tfoot td {
      position: sticky;
      bottom: 0;
      z-index: 2;
      background: #edf2ff;
      color: #0e3f9d;
      font-weight: 800;
    }

    .empty {
      height: 130px;
      color: #64748b;
      text-align: center !important;
    }

    .inactive-row { color: #94a3b8; background: #f8fafc; }

    .status-badge {
      display: inline-flex;
      min-width: 46px;
      justify-content: center;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .status-badge.active { background: #dcfce7; color: #047857; }
    .status-badge.inactive { background: #e2e8f0; color: #64748b; }

    .list-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 10px;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }

    .notice {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.5;
    }

    .notice.show { display: block; }
    .notice.info { background: #eff6ff; color: #1d4ed8; }
    .notice.success { background: #ecfdf5; color: #047857; }
    .notice.error { background: #fff1f2; color: #be123c; }

    .loading {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.42);
    }

    .loading.show { display: flex; }

    .loading-box {
      padding: 17px 22px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      font-weight: 800;
    }

    @media (max-width: 1000px) {
      .search-frame { grid-template-columns: 1fr 1fr; }
      .search-buttons { grid-column: 1 / -1; }
      .editor-grid { grid-template-columns: 1fr 1fr; }
      .action-frame { align-items: flex-start; flex-direction: column; }
      .action-buttons { width: 100%; justify-content: flex-start; }
    }

    @media (max-width: 600px) {
      .page { padding: 8px; }
      .title-area h1 { font-size: 19px; }
      .file-name { display: block; margin: 3px 0 0; }
      .main-button {
        min-width: 92px;
        height: 38px;
        padding: 0 10px;
        font-size: 12px;
      }
      .search-frame,
      .editor-grid { grid-template-columns: 1fr; }
      .search-buttons { grid-column: auto; justify-content: stretch; }
      .search-buttons .btn { flex: 1; }
      .action-buttons { display: grid; grid-template-columns: 1fr 1fr; }
      .action-buttons .btn { width: 100%; }
      .list-frame { padding: 10px; }
      table { min-width: 1160px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="title-frame">
      <div class="title-area">
        <h1>
          개선항목관리
          <span class="file-name">_improvement_item_management.html</span>
        </h1>
        <div class="subtitle">HeatPro MES · 로그인 회사의 개선 구분 및 세부항목 조회·등록·수정·삭제</div>
      </div>

      <button class="main-button" type="button" onclick="goMain()">⌂ 메인화면</button>
    </section>

    <section class="search-frame" aria-label="개선항목 조회 조건">
      <div class="field">
        <label for="searchCategory">구분</label>
        <input id="searchCategory" type="search" maxlength="100" placeholder="전체" autocomplete="off">
      </div>

      <div class="field">
        <label for="searchKeyword">항목 검색</label>
        <input id="searchKeyword" type="search" maxlength="100" placeholder="항목1~항목7 통합검색" autocomplete="off">
      </div>

      <div class="search-buttons">
        <button class="btn btn-blue" type="button" onclick="searchRows()">🔍 조회</button>
        <button class="btn" type="button" onclick="resetSearch()">초기화</button>
      </div>
    </section>

    <section class="action-frame">
      <div id="guideText" class="guide-text">개선항목 데이터를 불러오는 중입니다.</div>

      <div class="action-buttons">
        <button id="btnNew" class="btn btn-green" type="button" onclick="startNew()">＋ 등록</button>
        <button id="btnEdit" class="btn btn-blue" type="button" onclick="startEdit()" disabled>✎ 수정</button>
        <button id="btnSave" class="btn btn-green" type="button" onclick="saveRecord()" disabled>▣ 저장</button>
        <button id="btnDelete" class="btn btn-red" type="button" onclick="deleteSelected()" disabled>▣ 삭제</button>
      </div>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <section id="editorFrame" class="editor-frame">
      <div class="editor-head">
        <h2>개선항목 정보 입력</h2>
        <span id="modeBadge" class="mode-badge">대기</span>
      </div>

      <form id="improvementForm" onsubmit="return false;">
        <div class="editor-grid">
          <div class="field">
            <label for="displayOrder">번호 *</label>
            <input id="displayOrder" type="number" min="1" max="9999" step="1" inputmode="numeric" disabled>
          </div>

          <div class="field">
            <label for="categoryName">구분 *</label>
            <input id="categoryName" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="item1">항목1</label>
            <input id="item1" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="item2">항목2</label>
            <input id="item2" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="item3">항목3</label>
            <input id="item3" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="item4">항목4</label>
            <input id="item4" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="item5">항목5</label>
            <input id="item5" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="item6">항목6</label>
            <input id="item6" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="item7">항목7</label>
            <input id="item7" maxlength="100" autocomplete="off" disabled>
          </div>

          <div class="field">
            <label for="isActive">사용 상태</label>
            <select id="isActive" disabled>
              <option value="true">사용</option>
              <option value="false">중지</option>
            </select>
          </div>
        </div>
      </form>
    </section>

    <section class="list-frame">
      <h2 class="list-title">개선항목 상세현황</h2>

      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width:70px;">
            <col style="width:150px;">
            <col style="width:130px;">
            <col style="width:130px;">
            <col style="width:130px;">
            <col style="width:130px;">
            <col style="width:130px;">
            <col style="width:130px;">
            <col style="width:150px;">
            <col style="width:80px;">
          </colgroup>

          <thead>
            <tr>
              <th>번호</th>
              <th>구분</th>
              <th>항목1</th>
              <th>항목2</th>
              <th>항목3</th>
              <th>항목4</th>
              <th>항목5</th>
              <th>항목6</th>
              <th>항목7</th>
              <th>상태</th>
            </tr>
          </thead>

          <tbody id="tableBody">
            <tr><td class="empty" colspan="10">개선항목 데이터를 불러오는 중입니다.</td></tr>
          </tbody>

          <tfoot>
            <tr>
              <td colspan="2">합계</td>
              <td id="totalCount" colspan="8">0건</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div id="countLabel" class="list-footer">총 0건</div>
    </section>
  </main>

  <div id="loadingOverlay" class="loading">
    <div id="loadingText" class="loading-box">처리 중입니다...</div>
  </div>

  <script>
    "use strict";

    const SUPABASE_URL = "https://enxtgbyslnryxvfpjdkc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9w9ktk0x4D8I6QodkWOthA_4FcxzMwD";
    const LOGIN_PAGE_URL = "../index.html";

    const COMPANY_MAIN_PAGES = Object.freeze({
      "17f2ff71-20db-49ff-b682-279989776817": "main1.html",
      "8926eb68-aad3-4355-a51a-628a18757f71": "main2.html",
      "547df2c3-cdf0-40f6-8ec9-868bcb72f946": "main3.html"
    });

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    let currentUser = null;
    let currentProfile = null;
    let allRows = [];
    let visibleRows = [];
    let selectedId = null;
    let mode = "view";

    const editableFieldIds = [
      "displayOrder",
      "categoryName",
      "item1",
      "item2",
      "item3",
      "item4",
      "item5",
      "item6",
      "item7",
      "isActive"
    ];

    function normalizeText(value) {
      return String(value ?? "").trim();
    }

    function nullableText(value) {
      const text = normalizeText(value);
      return text || null;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character];
      });
    }

    function formatDbError(error) {
      if (!error) return "알 수 없는 오류입니다.";
      if (error.code === "23505") return "같은 회사에 같은 번호 또는 같은 구분이 이미 등록되어 있습니다.";
      if (error.code === "23503") return "다른 업무 데이터에서 사용 중이므로 삭제할 수 없습니다.";
      if (error.code === "23514") return "번호는 1 이상의 정수이고 구분은 필수입니다.";
      if (error.code === "42501") return "이 작업에 대한 권한이 없습니다. Supabase RLS 정책을 확인해 주세요.";
      if (error.code === "42P01") return "improvement_items 테이블이 없습니다. 제공된 SQL을 먼저 실행해 주세요.";
      return error.message || String(error);
    }

    function showLoading(show, text = "처리 중입니다...") {
      document.getElementById("loadingText").textContent = text;
      document.getElementById("loadingOverlay").classList.toggle("show", Boolean(show));
    }

    function showNotice(text, type = "info") {
      const notice = document.getElementById("notice");
      notice.textContent = text;
      notice.className = "notice show " + type;
    }

    function clearNotice() {
      const notice = document.getElementById("notice");
      notice.textContent = "";
      notice.className = "notice";
    }

    function updateGuide(text) {
      document.getElementById("guideText").textContent = text;
    }

    async function verifyCompanyAccess() {
      const { data: userData, error: userError } = await sb.auth.getUser();
      const user = userData?.user;

      if (userError || !user) {
        window.location.replace(LOGIN_PAGE_URL);
        return false;
      }

      const { data: profile, error: profileError } = await sb
        .from("profiles")
        .select("company_id,is_active")
        .eq("user_id", user.id)
        .single();

      if (
        profileError ||
        !profile ||
        profile.is_active !== true ||
        !profile.company_id
      ) {
        console.error("회사 권한 확인 실패:", profileError);
        await sb.auth.signOut({ scope: "local" });
        window.location.replace(LOGIN_PAGE_URL);
        return false;
      }

      currentUser = user;
      currentProfile = profile;
      document.documentElement.classList.remove("auth-pending");
      return true;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const editing = mode === "new" || mode === "edit";

      editableFieldIds.forEach(function (id) {
        document.getElementById(id).disabled = !editing;
      });

      document.getElementById("btnSave").disabled = !editing;
      document.getElementById("btnEdit").disabled = !selectedId || editing;
      document.getElementById("btnDelete").disabled = !selectedId || editing;
      document.getElementById("editorFrame").classList.toggle("show", editing || Boolean(selectedId));

      const badge = document.getElementById("modeBadge");
      badge.className = "mode-badge" + (mode === "new" ? " new" : mode === "edit" ? " edit" : "");
      badge.textContent = mode === "new" ? "신규등록" : mode === "edit" ? "수정중" : selectedId ? "선택됨" : "대기";
    }

    function clearForm() {
      selectedId = null;
      document.getElementById("improvementForm").reset();
      document.getElementById("isActive").value = "true";

      document.querySelectorAll("#tableBody tr").forEach(function (row) {
        row.classList.remove("selected");
      });
    }

    function getNextDisplayOrder() {
      if (!allRows.length) return 1;
      return Math.max(...allRows.map(function (row) {
        return Number(row.display_order) || 0;
      })) + 1;
    }

    function fillForm(row) {
      document.getElementById("displayOrder").value = row.display_order ?? "";
      document.getElementById("categoryName").value = row.category_name || "";
      document.getElementById("item1").value = row.item1 || "";
      document.getElementById("item2").value = row.item2 || "";
      document.getElementById("item3").value = row.item3 || "";
      document.getElementById("item4").value = row.item4 || "";
      document.getElementById("item5").value = row.item5 || "";
      document.getElementById("item6").value = row.item6 || "";
      document.getElementById("item7").value = row.item7 || "";
      document.getElementById("isActive").value = row.is_active === false ? "false" : "true";
    }

    async function loadRows(successMessage = "") {
      if (!currentProfile) return;

      showLoading(true, "개선항목 목록을 불러오는 중입니다...");

      const { data, error } = await sb
        .from("improvement_items")
        .select("improvement_item_system_id,display_order,category_name,item1,item2,item3,item4,item5,item6,item7,is_active")
        .eq("company_id", currentProfile.company_id)
        .order("display_order", { ascending: true });

      showLoading(false);

      if (error) {
        allRows = [];
        visibleRows = [];
        renderRows();
        showNotice("조회 실패: " + formatDbError(error), "error");
        updateGuide("개선항목 조회에 실패했습니다.");
        return;
      }

      allRows = data || [];
      applySearch(false);
      clearForm();
      setMode("view");
      updateGuide("개선항목 " + allRows.length + "건을 불러왔습니다.");

      if (successMessage) showNotice(successMessage, "success");
    }

    function applySearch(resetSelection = true) {
      const category = normalizeText(document.getElementById("searchCategory").value).toLowerCase();
      const keyword = normalizeText(document.getElementById("searchKeyword").value).toLowerCase();

      visibleRows = allRows.filter(function (row) {
        const categoryMatched = !category || String(row.category_name || "").toLowerCase().includes(category);
        const itemText = [row.item1, row.item2, row.item3, row.item4, row.item5, row.item6, row.item7]
          .map(function (value) { return String(value || ""); })
          .join(" ")
          .toLowerCase();
        const keywordMatched = !keyword || itemText.includes(keyword);
        return categoryMatched && keywordMatched;
      });

      if (resetSelection) {
        selectedId = null;
        clearForm();
        setMode("view");
      }

      renderRows();
    }

    function renderRows() {
      const body = document.getElementById("tableBody");

      if (!visibleRows.length) {
        body.innerHTML = '<tr><td class="empty" colspan="10">표시할 개선항목이 없습니다.</td></tr>';
      } else {
        body.innerHTML = visibleRows.map(function (row) {
          const id = escapeHtml(row.improvement_item_system_id);
          const inactiveClass = row.is_active === false ? " inactive-row" : "";
          const statusClass = row.is_active === false ? "inactive" : "active";
          const statusText = row.is_active === false ? "중지" : "사용";

          return `
            <tr class="${inactiveClass.trim()}" data-id="${id}" onclick="selectRow('${id}')">
              <td>${escapeHtml(row.display_order)}</td>
              <td>${escapeHtml(row.category_name)}</td>
              <td>${escapeHtml(row.item1)}</td>
              <td>${escapeHtml(row.item2)}</td>
              <td>${escapeHtml(row.item3)}</td>
              <td>${escapeHtml(row.item4)}</td>
              <td>${escapeHtml(row.item5)}</td>
              <td>${escapeHtml(row.item6)}</td>
              <td>${escapeHtml(row.item7)}</td>
              <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            </tr>
          `;
        }).join("");
      }

      document.getElementById("totalCount").textContent = visibleRows.length + "건";
      document.getElementById("countLabel").textContent = "총 " + visibleRows.length + "건";
    }

    function searchRows() {
      clearNotice();
      applySearch(true);
      updateGuide("조회조건에 맞는 개선항목 " + visibleRows.length + "건을 표시합니다.");
      showNotice("조회가 완료되었습니다.", "success");
    }

    function resetSearch() {
      document.getElementById("searchCategory").value = "";
      document.getElementById("searchKeyword").value = "";
      clearNotice();
      applySearch(true);
      updateGuide("조회조건을 초기화했습니다.");
      showNotice("조회조건이 초기화되었습니다.", "success");
    }

    function selectRow(id) {
      const row = allRows.find(function (item) {
        return item.improvement_item_system_id === id;
      });

      if (!row) return;

      selectedId = id;
      fillForm(row);

      document.querySelectorAll("#tableBody tr").forEach(function (tableRow) {
        tableRow.classList.toggle("selected", tableRow.dataset.id === id);
      });

      clearNotice();
      setMode("view");
      updateGuide("선택한 개선항목을 확인하거나 수정·삭제할 수 있습니다.");
    }

    function startNew() {
      clearNotice();
      clearForm();
      document.getElementById("displayOrder").value = getNextDisplayOrder();
      setMode("new");
      document.getElementById("categoryName").focus();
      updateGuide("신규 개선항목을 입력한 후 저장 버튼을 눌러 주세요.");
      showNotice("신규 등록 입력 상태입니다.", "info");
    }

    function startEdit() {
      if (!selectedId) {
        showNotice("수정할 개선항목을 목록에서 선택해 주세요.", "error");
        return;
      }

      clearNotice();
      setMode("edit");
      document.getElementById("categoryName").focus();
      updateGuide("선택한 개선항목을 수정한 후 저장 버튼을 눌러 주세요.");
      showNotice("수정 입력 상태입니다.", "info");
    }

    function buildPayload() {
      const displayOrder = Number(document.getElementById("displayOrder").value);
      const categoryName = normalizeText(document.getElementById("categoryName").value);

      if (!Number.isInteger(displayOrder) || displayOrder < 1) {
        throw new Error("번호는 1 이상의 정수로 입력해 주세요.");
      }

      if (!categoryName) {
        throw new Error("구분을 입력해 주세요.");
      }

      return {
        company_id: currentProfile.company_id,
        display_order: displayOrder,
        category_name: categoryName,
        item1: nullableText(document.getElementById("item1").value),
        item2: nullableText(document.getElementById("item2").value),
        item3: nullableText(document.getElementById("item3").value),
        item4: nullableText(document.getElementById("item4").value),
        item5: nullableText(document.getElementById("item5").value),
        item6: nullableText(document.getElementById("item6").value),
        item7: nullableText(document.getElementById("item7").value),
        is_active: document.getElementById("isActive").value === "true"
      };
    }

    async function saveRecord() {
      if (mode !== "new" && mode !== "edit") {
        showNotice("등록 또는 수정 버튼을 먼저 눌러 주세요.", "error");
        return;
      }

      let payload;
      try {
        payload = buildPayload();
      } catch (error) {
        showNotice(error.message, "error");
        return;
      }

      showLoading(true, "개선항목 정보를 저장하는 중입니다...");

      let result;
      if (mode === "new") {
        result = await sb.from("improvement_items").insert(payload);
      } else {
        result = await sb
          .from("improvement_items")
          .update(payload)
          .eq("improvement_item_system_id", selectedId)
          .eq("company_id", currentProfile.company_id);
      }

      showLoading(false);

      if (result.error) {
        showNotice("저장 실패: " + formatDbError(result.error), "error");
        return;
      }

      const message = mode === "new"
        ? "개선항목이 Supabase에 신규 등록되었습니다."
        : "개선항목이 Supabase에 수정 저장되었습니다.";

      await loadRows(message);
    }

    async function deleteSelected() {
      if (!selectedId) {
        showNotice("삭제할 개선항목을 목록에서 선택해 주세요.", "error");
        return;
      }

      const row = allRows.find(function (item) {
        return item.improvement_item_system_id === selectedId;
      });

      const confirmed = confirm(
        (row?.category_name || "선택한 개선항목") + "을(를) 삭제하시겠습니까?"
      );

      if (!confirmed) return;

      showLoading(true, "개선항목을 삭제하는 중입니다...");

      const { error } = await sb
        .from("improvement_items")
        .delete()
        .eq("improvement_item_system_id", selectedId)
        .eq("company_id", currentProfile.company_id);

      showLoading(false);

      if (error) {
        showNotice("삭제 실패: " + formatDbError(error), "error");
        return;
      }

      await loadRows("개선항목이 Supabase에서 삭제되었습니다.");
    }

    function goMain() {
      const mainPage = COMPANY_MAIN_PAGES[currentProfile?.company_id] || "main1.html";
      window.location.href = mainPage;
    }

    sb.auth.onAuthStateChange(function (event) {
      if (event === "SIGNED_OUT") {
        window.location.replace(LOGIN_PAGE_URL);
      }
    });

    async function initializePage() {
      try {
        const allowed = await verifyCompanyAccess();
        if (!allowed) return;

        setMode("view");
        await loadRows();
      } catch (error) {
        document.documentElement.classList.remove("auth-pending");
        showNotice("화면 초기화 오류: " + formatDbError(error), "error");
      }
    }

    document.getElementById("searchCategory").addEventListener("keydown", function (event) {
      if (event.key === "Enter") searchRows();
    });

    document.getElementById("searchKeyword").addEventListener("keydown", function (event) {
      if (event.key === "Enter") searchRows();
    });

    window.addEventListener("load", initializePage);
  </script>
</body>
</html>
