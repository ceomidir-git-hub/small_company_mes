<!DOCTYPE html>
<html lang="ko" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이템 관리 | HeatPro MES</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f4f6f9;--card:#fff;--line:#cfd7e3;--text:#1f2937;--muted:#64748b;
      --blue:#1f5edb;--blue-dark:#1647ad;--green:#079660;--red:#dc2f45;
      --shadow:0 3px 12px rgba(15,23,42,.06);--radius:9px
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;background:var(--bg);color:var(--text)}
    html.auth-pending body{visibility:hidden}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.45}
    .page{width:100%;padding:8px 10px}
    .title-frame{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}
    .title-area{min-width:0}
    .title-area h1{display:inline;margin:0;color:#0e3f9d;font-size:22px;line-height:1.15;letter-spacing:-.4px}
    .file-name{margin-left:7px;color:#667085;font-size:13px;font-weight:400}
    .subtitle{margin-top:3px;color:#5f6b7a;font-size:12px}
    .main-button{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#1f2937;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
    .search-frame{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr) minmax(170px,1fr) auto;align-items:end;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
    .field{display:flex;flex-direction:column;gap:4px;min-width:0}
    .field label{color:#3f4d62;font-size:12px;font-weight:800}
    .field input,.field select{width:100%;height:36px;padding:6px 9px;border:1px solid #c7d0dc;border-radius:7px;background:#fff;color:var(--text);outline:none}
    .field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,94,219,.11)}
    .search-buttons,.action-buttons{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
    .btn{min-height:36px;padding:7px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#1f2937;font-size:13px;font-weight:800;white-space:nowrap}
    .btn-blue{border-color:var(--blue);background:var(--blue);color:#fff}
    .btn-green{border-color:var(--green);background:var(--green);color:#fff}
    .btn-red{border-color:var(--red);background:var(--red);color:#fff}
    .action-frame{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px}
    .guide-text{color:#617087;font-size:12px}
    .list-frame{padding:8px 10px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
    .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
    .list-title{margin:0;color:#0e3f9d;font-size:16px}
    .count-label{color:#475569;font-size:12px;font-weight:700}
    .table-wrap{width:100%;overflow-x:hidden;overflow-y:visible;border:1px solid #cbd5e1;background:#fff}
    table{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed;font-size:11px}
    th,td{padding:6px 4px;border-right:1px solid #d8dee8;border-bottom:1px solid #d8dee8;text-align:center;vertical-align:middle;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.25}
    thead th{position:sticky;top:0;z-index:3;background:#1e5bd7;color:#fff;font-weight:800}
    tbody tr{cursor:pointer}
    tbody tr:hover{background:#f5f8fd}
    tbody tr.selected{background:#e8f0ff;outline:2px solid rgba(31,94,219,.28);outline-offset:-2px}
    .empty{height:120px;color:#64748b;text-align:center!important}
    .notice{display:none;margin:0 0 7px;padding:8px 10px;border-radius:7px;font-size:12px}
    .notice.show{display:block}
    .notice.info{background:#eff6ff;color:#1d4ed8}
    .notice.success{background:#ecfdf5;color:#047857}
    .notice.error{background:#fff1f2;color:#be123c}
    .loading{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(15,23,42,.42)}
    .loading.show{display:flex}
    .loading-box{padding:16px 21px;border-radius:11px;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.18);font-weight:800}
    .modal-backdrop{display:none;position:fixed;inset:0;z-index:5000;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.48)}
    .modal-backdrop.show{display:flex}
    .modal{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.28)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 12px;border-bottom:1px solid #e3e8ef}
    .modal-head h2{margin:0;color:#0e3f9d;font-size:19px}
    .modal-close{width:34px;height:34px;border:0;background:transparent;font-size:25px;line-height:1;color:#475569}
    .modal-body{padding:14px 18px}
    .modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 14px}
    .modal-grid .full{grid-column:1/-1}
    .modal-actions{display:flex;justify-content:center;gap:10px;padding:12px 18px 17px;border-top:1px solid #e3e8ef}
    .modal-actions .btn{min-width:110px}
    .required{color:#dc2626}
    .help{color:#64748b;font-size:11px}
    .field input.auto-number[readonly]{background:#f1f5f9;color:#0e3f9d;font-weight:800}
    .auto-number-note{color:#64748b;font-size:11px;line-height:1.35}


    .sortable{cursor:pointer;user-select:none}
    .sortable:hover{background:#1647ad}
    .sort-mark{display:inline-block;min-width:14px;margin-left:3px;font-size:10px}
    .pagination{display:flex;align-items:center;justify-content:center;gap:5px;padding-top:9px;flex-wrap:wrap}
    .page-btn{min-width:32px;height:30px;padding:0 8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155;font-size:12px;font-weight:800}
    .page-btn.active{border-color:var(--blue);background:var(--blue);color:#fff}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}
    .page-info{margin-left:7px;color:#64748b;font-size:12px;font-weight:700}
    .print-title{display:none}
    @page{size:A4 landscape;margin:7mm}
    @media print{
      html,body{background:#fff!important;color:#000!important}
      .page{padding:0}.title-frame,.search-frame,.action-frame,.notice,.loading,.modal-backdrop,.list-head,.pagination{display:none!important}
      .print-title{display:block!important;margin:0 0 8px;text-align:center;font-size:17px}
      .list-frame{padding:0;border:0;box-shadow:none}.table-wrap{max-height:none;overflow:visible;border:1px solid #000}
      table{min-width:0!important;width:100%!important;font-size:7.5pt!important}
      th,td{position:static!important;padding:4px 3px!important;border:1px solid #000!important;background:#fff!important;color:#000!important}
    }
    @media(max-width:900px){
      .search-frame{grid-template-columns:1fr 1fr}.search-buttons{grid-column:1/-1}
      .action-frame{align-items:flex-start;flex-direction:column}.action-buttons{width:100%;justify-content:flex-start}
    }
    @media(max-width:600px){
      .page{padding:6px}.title-area h1{font-size:19px}.file-name{display:block;margin:2px 0 0}
      .search-frame{grid-template-columns:1fr}.search-buttons{grid-column:auto;justify-content:stretch}
      .search-buttons .btn{flex:1}.modal-grid{grid-template-columns:1fr}.modal-grid .full{grid-column:auto}
      .action-buttons{display:grid;grid-template-columns:repeat(3,1fr)}.action-buttons .btn{width:100%} table{font-size:9px} th,td{padding:5px 2px}
    }
  </style>
</head>
<body>
<main class="page">
  <section class="title-frame">
    <div class="title-area">
      <h1>아이템 관리</h1><span class="file-name">_system_edit_item.html</span>
      <div class="subtitle">HeatPro MES · 로그인 회사의 아이템 조회·등록·수정·삭제</div>
    </div>
    <button class="main-button" type="button" onclick="goMain()">⌂ 메인화면</button>
  </section>

  <section class="search-frame">
    <div class="field"><label for="searchCustomerId">고객사</label><select id="searchCustomerId"><option value="">전체</option></select></div>
    <div class="field"><label for="searchItemName">품명</label><select id="searchItemName"><option value="">전체</option></select></div>
    <div class="field"><label for="searchItemNumber">품번</label><input id="searchItemNumber" placeholder="품번 입력"></div>
    <div class="search-buttons">
      <button class="btn btn-blue" type="button" onclick="searchRows()">🔍 조회</button>
      <button class="btn" type="button" onclick="resetSearch()">초기화</button>
      <button class="btn btn-red" type="button" onclick="savePdf()">PDF 저장</button>
    </div>
  </section>

  <section class="action-frame">
    <div id="guideText" class="guide-text">데이터를 불러오는 중입니다.</div>
    <div class="action-buttons">
      <button class="btn btn-green" type="button" onclick="startNew()">＋ 등록</button>
      <button id="btnEdit" class="btn btn-blue" type="button" onclick="startEdit()" disabled>✎ 수정</button>
      <button id="btnDelete" class="btn btn-red" type="button" onclick="deleteSelected()" disabled>▣ 삭제</button>
    </div>
  </section>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <section class="list-frame">
    <div class="list-head">
      <h2 class="list-title">아이템 목록</h2>
      <div id="countLabel" class="count-label">총 0건</div>
    </div>
    <h2 class="print-title">Qgis 고객사별 Item 상세현황</h2>
    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:3.5%"><col style="width:6.5%"><col style="width:7%"><col style="width:8%">
          <col style="width:10.5%"><col style="width:10.5%"><col style="width:6.5%"><col style="width:10%">
          <col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:7.5%">
        </colgroup>
        <thead><tr>
          <th>번호</th><th>등록일</th><th>고객관리번호</th><th>고객사</th><th>품명</th><th>품번</th>
          <th>템퍼링</th>
          <th class="sortable" onclick="sortByDocument('control_plan_number')">관리계획서번호<span id="sortControlPlan" class="sort-mark"></span></th>
          <th class="sortable" onclick="sortByDocument('manufacturing_process_number')">제조공정도번호<span id="sortManufacturing" class="sort-mark"></span></th>
          <th class="sortable" onclick="sortByDocument('inspection_standard_number')">검사기준서번호<span id="sortInspection" class="sort-mark"></span></th>
          <th class="sortable" onclick="sortByDocument('work_standard_number')">작업표준서번호<span id="sortWork" class="sort-mark"></span></th>
          <th>사용</th>
        </tr></thead>
        <tbody id="tableBody"><tr><td class="empty" colspan="12">데이터를 불러오는 중입니다.</td></tr></tbody>
      </table>
    </div>
    <div id="pagination" class="pagination" aria-label="페이지 이동"></div>
  </section>
</main>

<section id="itemModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">아이템 정보 등록</h2>
      <button class="modal-close" type="button" onclick="closeModal()" aria-label="닫기">×</button>
    </div>
    <form id="editForm" onsubmit="return false;">
      <div class="modal-body">
        <div class="modal-grid">
          <div class="field"><label for="registeredDate">등록일</label><input id="registeredDate" type="date"></div>
          <div class="field"><label for="customerId">고객사 <span class="required">*</span></label><select id="customerId"><option value="">고객사 선택</option></select></div>
          <div class="field"><label for="itemName">품명 <span class="required">*</span></label><input id="itemName" maxlength="150"></div>
          <div class="field"><label for="itemNumber">품번 <span class="required">*</span></label><input id="itemNumber" maxlength="150"></div>
          <div class="field">
            <label for="temperingStatus">템퍼링 실시 유무</label>
            <select id="temperingStatus"><option value="">미입력</option><option value="미실시">미실시</option><option value="실시">실시</option></select>
          </div>
          <div class="field">
            <label for="controlPlanNumber">관리계획서번호</label>
            <input id="controlPlanNumber" class="auto-number" maxlength="150" readonly placeholder="고객사 선택 시 자동부여">
            <div class="auto-number-note">고객사 기준 마지막 관리계획서번호 +1 자동부여</div>
          </div>
          <div class="field"><label for="manufacturingProcessNumber">제조공정도번호</label><input id="manufacturingProcessNumber" maxlength="150" placeholder="예: MP-A-001-01"></div>
          <div class="field">
            <label for="inspectionStandardNumber">검사기준서번호</label>
            <input id="inspectionStandardNumber" class="auto-number" maxlength="150" readonly placeholder="고객사 선택 시 자동부여">
            <div class="auto-number-note">고객사 기준 마지막 검사기준서번호 +1 자동부여</div>
          </div>
          <div class="field">
            <label for="workStandardNumber">작업표준서번호</label>
            <input id="workStandardNumber" class="auto-number" maxlength="150" readonly placeholder="고객사 선택 시 자동부여">
            <div class="auto-number-note">고객사 기준 마지막 작업표준서번호 +1 자동부여</div>
          </div>
          <div class="field full"><label><input id="isActive" type="checkbox" checked> 사용 상태</label></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" type="button" onclick="closeModal()">취소</button>
        <button class="btn btn-blue" type="button" onclick="saveRecord()">저장</button>
      </div>
    </form>
  </div>
</section>

<div id="loadingOverlay" class="loading"><div id="loadingText" class="loading-box">처리 중입니다...</div></div>

<script>
"use strict";
const SUPABASE_URL="https://enxtgbyslnryxvfpjdkc.supabase.co";
const SUPABASE_KEY="sb_publishable_9w9ktk0x4D8I6QodkWOthA_4FcxzMwD";
const LOGIN_PAGE_URL="../index.html";
const MAIN_PAGE_URL="main1.html";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

let currentProfile=null,customers=[],allRows=[],visibleRows=[],selectedId=null,mode="view",currentPage=1,sortField="",sortDirection="asc";const PAGE_SIZE=20;
let editOriginalCustomerId="",editOriginalAutoValues=null;
const autoGeneratedFields=new Set();
const AUTO_DOCUMENTS=[
  {inputId:"controlPlanNumber",column:"control_plan_number",prefix:"CO",label:"관리계획서번호"},
  {inputId:"inspectionStandardNumber",column:"inspection_standard_number",prefix:"IS",label:"검사기준서번호"},
  {inputId:"workStandardNumber",column:"work_standard_number",prefix:"WS",label:"작업표준서번호"}
];

function n(v){return String(v??"").trim()}
function e(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loading(show,text="처리 중입니다..."){loadingText.textContent=text;loadingOverlay.classList.toggle("show",!!show)}
function notice(text,type="info"){const x=document.getElementById("notice");x.textContent=text;x.className="notice show "+type}
function clearNotice(){const x=document.getElementById("notice");x.textContent="";x.className="notice"}
function guide(text){guideText.textContent=text}
function dbError(x){
  if(!x)return"알 수 없는 오류입니다.";
  if(x.code==="23505")return"같은 회사에서 이미 사용 중인 관리계획서번호가 있습니다. 자동번호를 다시 계산한 뒤 재저장해 주세요.";
  if(x.code==="23503")return"다른 업무 데이터에서 사용 중이므로 삭제할 수 없습니다.";
  if(x.code==="42501")return"권한이 없습니다. RLS 정책을 확인해 주세요.";
  return x.message||String(x)
}
async function auth(){
  const {data:u,error:ue}=await sb.auth.getUser();const user=u?.user;
  if(ue||!user){location.replace(LOGIN_PAGE_URL);return false}
  const {data:p,error:pe}=await sb.from("profiles").select("company_id,is_active").eq("user_id",user.id).single();
  if(pe||!p||p.is_active!==true||!p.company_id){await sb.auth.signOut({scope:"local"});location.replace(LOGIN_PAGE_URL);return false}
  currentProfile=p;document.documentElement.classList.remove("auth-pending");return true
}
function goMain(){location.href=MAIN_PAGE_URL}
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")location.replace(LOGIN_PAGE_URL)});

async function loadCustomers(){
  const prevSearch=n(searchCustomerId.value),prevEdit=n(customerId.value);
  const {data,error}=await sb.from("customers")
    .select("customer_system_id,company_number,customer_name,is_active")
    .eq("company_id",currentProfile.company_id).order("company_number");
  if(error)throw error;
  customers=data||[];
  const active=customers.filter(x=>x.is_active!==false&&n(x.customer_name));
  searchCustomerId.innerHTML='<option value="">전체</option>'+active.map(x=>`<option value="${e(x.customer_system_id)}">${e(x.customer_name)}</option>`).join("");
  customerId.innerHTML='<option value="">고객사 선택</option>'+active.map(x=>`<option value="${e(x.customer_system_id)}">${e(x.company_number)} · ${e(x.customer_name)}</option>`).join("");
  if(active.some(x=>x.customer_system_id===prevSearch))searchCustomerId.value=prevSearch;
  if(active.some(x=>x.customer_system_id===prevEdit))customerId.value=prevEdit;
}
function updateSearchItemNames(){
  const customer=n(searchCustomerId.value),prev=n(searchItemName.value);
  const names=[...new Set(allRows.filter(r=>!customer||r.customer_system_id===customer).map(r=>n(r.item_name)).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"ko",{numeric:true,sensitivity:"base"}));
  searchItemName.innerHTML='<option value="">전체</option>'+names.map(v=>`<option value="${e(v)}">${e(v)}</option>`).join("");
  if(names.includes(prev))searchItemName.value=prev;
}
async function loadRows(){
  loading(true,"아이템정보를 불러오는 중입니다...");clearNotice();
  try{
    await loadCustomers();
    const {data,error}=await sb.from("items")
      .select("item_system_id,customer_system_id,registered_date,item_name,item_number,tempering_status,control_plan_number,manufacturing_process_number,inspection_standard_number,work_standard_number,is_active")
      .eq("company_id",currentProfile.company_id)
      .order("registered_date",{ascending:true,nullsFirst:false})
      .order("item_name",{ascending:true}).order("item_number",{ascending:true});
    if(error)throw error;
    allRows=(data||[]).map(r=>{const c=customers.find(x=>x.customer_system_id===r.customer_system_id)||{};return {...r,company_number:c.company_number||"",customer_name:c.customer_name||""}});
    updateSearchItemNames();apply();clearSelection();
    guide("아이템정보 "+allRows.length+"건을 등록일 오름차순으로 불러왔습니다.");
  }catch(error){
    allRows=[];visibleRows=[];render();notice("조회 실패: "+dbError(error),"error");
  }finally{loading(false)}
}
function apply(){
  const customer=n(searchCustomerId.value),itemName=n(searchItemName.value),itemNumber=n(searchItemNumber.value).toLowerCase();
  visibleRows=allRows.filter(r=>
    (!customer||r.customer_system_id===customer)&&
    (!itemName||n(r.item_name)===itemName)&&
    (!itemNumber||n(r.item_number).toLowerCase().includes(itemNumber))
  );
  sortVisibleRows();
  currentPage=1;clearSelection();render();
}

function sortVisibleRows(){
  if(sortField){
    visibleRows.sort((a,b)=>{
      const av=n(a[sortField]),bv=n(b[sortField]);
      if(!av&&!bv)return 0;
      if(!av)return 1;
      if(!bv)return -1;
      const result=av.localeCompare(bv,"ko",{numeric:true,sensitivity:"base"});
      return sortDirection==="asc"?result:-result;
    });
  }else{
    visibleRows.sort((a,b)=>{
      const d=n(a.registered_date||"9999-12-31").localeCompare(n(b.registered_date||"9999-12-31"));if(d)return d;
      const c=n(a.company_number).localeCompare(n(b.company_number),"ko",{numeric:true});if(c)return c;
      const i=n(a.item_name).localeCompare(n(b.item_name),"ko",{numeric:true});if(i)return i;
      return n(a.control_plan_number).localeCompare(n(b.control_plan_number),"ko",{numeric:true});
    });
  }
  updateSortMarks();
}
function sortByDocument(field){
  if(sortField===field){
    sortDirection=sortDirection==="asc"?"desc":"asc";
  }else{
    sortField=field;
    sortDirection="asc";
  }
  sortVisibleRows();
  currentPage=1;
  clearSelection();
  render();
}
function updateSortMarks(){
  const map={
    control_plan_number:"sortControlPlan",
    manufacturing_process_number:"sortManufacturing",
    inspection_standard_number:"sortInspection",
    work_standard_number:"sortWork"
  };
  Object.values(map).forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=""});
  if(sortField&&map[sortField]){
    const el=document.getElementById(map[sortField]);
    if(el)el.textContent=sortDirection==="asc"?"▲":"▼";
  }
}

function clearSelection(){selectedId=null;btnEdit.disabled=true;btnDelete.disabled=true}
async function searchRows(){await loadRows();notice("아이템 조회가 완료되었습니다. 조회 건수: "+visibleRows.length+"건","success")}
function resetSearch(){searchCustomerId.value="";updateSearchItemNames();searchItemName.value="";searchItemNumber.value="";apply();notice("조회조건을 초기화했습니다.","success")}
function render(){
  const totalPages=Math.max(1,Math.ceil(visibleRows.length/PAGE_SIZE));
  if(currentPage>totalPages)currentPage=totalPages;
  const start=(currentPage-1)*PAGE_SIZE;
  const pageRows=visibleRows.slice(start,start+PAGE_SIZE);

  tableBody.innerHTML=pageRows.length?pageRows.map((r,index)=>`
    <tr data-id="${e(r.item_system_id)}" onclick="selectRow('${e(r.item_system_id)}')">
      <td>${start+index+1}</td><td>${e(r.registered_date||"")}</td><td>${e(r.company_number)}</td><td>${e(r.customer_name)}</td>
      <td title="${e(r.item_name)}">${e(r.item_name)}</td><td title="${e(r.item_number)}">${e(r.item_number)}</td>
      <td>${e(r.tempering_status||"미입력")}</td><td>${e(r.control_plan_number||"")}</td>
      <td title="${e(r.manufacturing_process_number||"")}">${e(r.manufacturing_process_number||"")}</td><td title="${e(r.inspection_standard_number||"")}">${e(r.inspection_standard_number||"")}</td>
      <td>${e(r.work_standard_number||"")}</td>
      <td>${r.is_active!==false?"사용":"중지"}</td>
    </tr>`).join(""):'<tr><td class="empty" colspan="12">표시할 아이템이 없습니다.</td></tr>';

  countLabel.textContent="총 "+visibleRows.length+"건 · "+currentPage+"/"+totalPages+"페이지";
  renderPagination(totalPages);
}
function renderPagination(totalPages){
  if(!visibleRows.length){pagination.innerHTML="";return}
  const buttons=[];
  buttons.push(`<button class="page-btn" type="button" onclick="changePage(1)" ${currentPage===1?"disabled":""}>≪</button>`);
  buttons.push(`<button class="page-btn" type="button" onclick="changePage(${currentPage-1})" ${currentPage===1?"disabled":""}>‹</button>`);

  const startPage=Math.max(1,currentPage-2);
  const endPage=Math.min(totalPages,startPage+4);
  const adjustedStart=Math.max(1,endPage-4);

  for(let page=adjustedStart;page<=endPage;page++){
    buttons.push(`<button class="page-btn ${page===currentPage?"active":""}" type="button" onclick="changePage(${page})">${page}</button>`);
  }

  buttons.push(`<button class="page-btn" type="button" onclick="changePage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>›</button>`);
  buttons.push(`<button class="page-btn" type="button" onclick="changePage(${totalPages})" ${currentPage===totalPages?"disabled":""}>≫</button>`);
  buttons.push(`<span class="page-info">페이지당 20건</span>`);
  pagination.innerHTML=buttons.join("");
}
function changePage(page){
  const totalPages=Math.max(1,Math.ceil(visibleRows.length/PAGE_SIZE));
  currentPage=Math.min(Math.max(1,page),totalPages);
  clearSelection();
  render();
  document.querySelector(".list-frame")?.scrollIntoView({behavior:"smooth",block:"start"});
}
function selectRow(id){
  selectedId=id;btnEdit.disabled=false;btnDelete.disabled=false;
  document.querySelectorAll("#tableBody tr").forEach(x=>x.classList.toggle("selected",x.dataset.id===id));
  guide("선택한 아이템을 수정하거나 삭제할 수 있습니다.");
}
function formatDocumentNumber(prefix,companyNumber,sequence){
  return `${prefix}-${companyNumber}-${String(sequence).padStart(2,"0")}`;
}
function documentSequence(value,prefix,companyNumber){
  const text=n(value);
  const head=`${prefix}-${companyNumber}-`;
  if(!text.startsWith(head))return null;
  const suffix=text.slice(head.length);
  if(!/^\d+$/.test(suffix))return null;
  const number=Number(suffix);
  return Number.isSafeInteger(number)&&number>0?number:null;
}
async function getNextDocumentNumbers(customerSystemId){
  const selectedCustomer=customers.find(x=>x.customer_system_id===customerSystemId&&x.is_active!==false);
  if(!selectedCustomer)throw new Error("고객사 정보를 찾을 수 없습니다.");

  const {data,error}=await sb.from("items")
    .select("control_plan_number,inspection_standard_number,work_standard_number")
    .eq("company_id",currentProfile.company_id)
    .eq("customer_system_id",customerSystemId);
  if(error)throw error;

  const rows=data||[];
  const result={};
  for(const cfg of AUTO_DOCUMENTS){
    let maxSequence=0;
    for(const row of rows){
      const seq=documentSequence(row[cfg.column],cfg.prefix,selectedCustomer.company_number);
      if(seq!==null&&seq>maxSequence)maxSequence=seq;
    }
    result[cfg.inputId]=formatDocumentNumber(cfg.prefix,selectedCustomer.company_number,maxSequence+1);
  }
  return result;
}
async function assignAutoDocumentNumbers(fieldIds=AUTO_DOCUMENTS.map(x=>x.inputId)){
  const customerSystemId=n(customerId.value);
  if(!customerSystemId){
    for(const id of fieldIds){
      document.getElementById(id).value="";
      autoGeneratedFields.delete(id);
    }
    return;
  }

  const nextNumbers=await getNextDocumentNumbers(customerSystemId);
  for(const id of fieldIds){
    if(!(id in nextNumbers))continue;
    document.getElementById(id).value=nextNumbers[id];
    autoGeneratedFields.add(id);
  }
}
function originalMissingAutoFieldIds(){
  if(!editOriginalAutoValues)return[];
  return AUTO_DOCUMENTS
    .filter(cfg=>!n(editOriginalAutoValues[cfg.inputId]))
    .map(cfg=>cfg.inputId);
}
async function handleEditCustomerChange(){
  const newCustomerId=n(customerId.value);
  try{
    loading(true,"문서번호를 자동 계산하는 중입니다...");
    if(!newCustomerId){
      for(const cfg of AUTO_DOCUMENTS)document.getElementById(cfg.inputId).value="";
      autoGeneratedFields.clear();
      return;
    }

    if(mode==="edit"&&newCustomerId===editOriginalCustomerId&&editOriginalAutoValues){
      for(const cfg of AUTO_DOCUMENTS){
        document.getElementById(cfg.inputId).value=editOriginalAutoValues[cfg.inputId]||"";
      }
      autoGeneratedFields.clear();
      const missing=originalMissingAutoFieldIds();
      if(missing.length)await assignAutoDocumentNumbers(missing);
    }else{
      autoGeneratedFields.clear();
      await assignAutoDocumentNumbers();
    }
  }catch(error){
    notice("문서번호 자동 계산 실패: "+dbError(error),"error");
  }finally{loading(false)}
}
function clearForm(){
  editForm.reset();registeredDate.value=new Date().toISOString().slice(0,10);
  temperingStatus.value="";isActive.checked=true;
  editOriginalCustomerId="";editOriginalAutoValues=null;autoGeneratedFields.clear();
}
function fillForm(r){
  registeredDate.value=r.registered_date||"";
  customerId.value=r.customer_system_id||"";
  itemName.value=r.item_name||"";itemNumber.value=r.item_number||"";
  temperingStatus.value=r.tempering_status||"";
  controlPlanNumber.value=r.control_plan_number||"";
  manufacturingProcessNumber.value=r.manufacturing_process_number||"";
  inspectionStandardNumber.value=r.inspection_standard_number||"";
  workStandardNumber.value=r.work_standard_number||"";
  isActive.checked=r.is_active!==false;
}
function openModal(){itemModal.classList.add("show");document.body.style.overflow="hidden"}
function closeModal(){itemModal.classList.remove("show");document.body.style.overflow=""}
function startNew(){
  mode="new";clearForm();modalTitle.textContent="아이템 정보 등록";openModal();setTimeout(()=>customerId.focus(),50);
}
async function startEdit(){
  if(!selectedId)return notice("수정할 아이템을 선택해 주세요.","error");
  const r=allRows.find(x=>x.item_system_id===selectedId);if(!r)return;

  mode="edit";
  editOriginalCustomerId=r.customer_system_id||"";
  editOriginalAutoValues={
    controlPlanNumber:r.control_plan_number||"",
    inspectionStandardNumber:r.inspection_standard_number||"",
    workStandardNumber:r.work_standard_number||""
  };
  autoGeneratedFields.clear();
  fillForm(r);

  const missing=originalMissingAutoFieldIds();
  if(missing.length&&r.customer_system_id){
    loading(true,"비어 있는 문서번호를 자동 계산하는 중입니다...");
    try{
      await assignAutoDocumentNumbers(missing);
    }catch(error){
      notice("문서번호 자동 계산 실패: "+dbError(error),"error");
    }finally{loading(false)}
  }

  modalTitle.textContent="아이템 정보 수정";openModal();
}
async function saveItemPayload(payload){
  return mode==="new"
    ?await sb.from("items").insert(payload)
    :await sb.from("items").update(payload).eq("item_system_id",selectedId).eq("company_id",currentProfile.company_id);
}
async function saveRecord(){
  const selectedCustomer=customers.find(x=>x.customer_system_id===customerId.value&&x.is_active!==false);
  if(!selectedCustomer)return notice("고객사를 선택해 주세요.","error");

  const itemNameValue=n(itemName.value),itemNumberValue=n(itemNumber.value);
  if(!itemNameValue||!itemNumberValue)return notice("품명과 품번을 입력해 주세요.","error");

  loading(true,"문서번호를 확인하고 저장하는 중입니다...");
  try{
    const customerChanged=mode==="edit"&&n(customerId.value)!==n(editOriginalCustomerId);

    // 신규등록은 3개 번호를 모두 최신 MAX+1로 다시 계산합니다.
    // 수정은 고객사가 변경되었거나, 원래 비어 있던 번호만 최신 MAX+1로 다시 계산합니다.
    if(mode==="new"||customerChanged){
      autoGeneratedFields.clear();
      await assignAutoDocumentNumbers();
    }else if(autoGeneratedFields.size){
      await assignAutoDocumentNumbers([...autoGeneratedFields]);
    }

    const makePayload=()=>({
      company_id:currentProfile.company_id,
      registered_date:registeredDate.value||null,
      customer_system_id:selectedCustomer.customer_system_id,
      item_name:itemNameValue,
      item_number:itemNumberValue,
      tempering_status:n(temperingStatus.value)||null,
      control_plan_number:n(controlPlanNumber.value)||null,
      manufacturing_process_number:n(manufacturingProcessNumber.value)||null,
      inspection_standard_number:n(inspectionStandardNumber.value)||null,
      work_standard_number:n(workStandardNumber.value)||null,
      is_active:isActive.checked
    });

    let res=await saveItemPayload(makePayload());

    // 동시에 다른 사용자가 같은 다음 번호를 먼저 저장한 경우, 한 번 더 최신 번호를 계산해 재시도합니다.
    if(res.error?.code==="23505"&&autoGeneratedFields.size){
      await assignAutoDocumentNumbers([...autoGeneratedFields]);
      res=await saveItemPayload(makePayload());
    }

    if(res.error)return notice("저장 실패: "+dbError(res.error),"error");

    const savedControl=n(controlPlanNumber.value);
    const savedInspection=n(inspectionStandardNumber.value);
    const savedWork=n(workStandardNumber.value);
    const savedMode=mode;
    closeModal();
    await loadRows();
    notice(
      (savedMode==="new"?"아이템 신규 등록":"아이템 수정")+
      `이 완료되었습니다. 관리계획서 ${savedControl||"-"} / 검사기준서 ${savedInspection||"-"} / 작업표준서 ${savedWork||"-"}`,
      "success"
    );
  }catch(error){
    notice("저장 실패: "+dbError(error),"error");
  }finally{loading(false)}
}
async function deleteSelected(){
  if(!selectedId)return notice("삭제할 아이템을 선택해 주세요.","error");
  if(!confirm("선택한 아이템을 삭제하시겠습니까?"))return;
  loading(true,"삭제 중입니다...");
  const {error}=await sb.from("items").delete().eq("item_system_id",selectedId).eq("company_id",currentProfile.company_id);
  loading(false);
  if(error)return notice("삭제 실패: "+dbError(error),"error");
  await loadRows();notice("아이템 삭제가 완료되었습니다.","success");
}
function savePdf(){
  if(!visibleRows.length)return notice("PDF로 저장할 데이터가 없습니다.","error");
  setTimeout(()=>window.print(),80);
}
itemModal.addEventListener("click",ev=>{if(ev.target===itemModal)closeModal()});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&itemModal.classList.contains("show"))closeModal()});
searchCustomerId.addEventListener("change",()=>{updateSearchItemNames();apply()});
customerId.addEventListener("change",handleEditCustomerChange);
async function init(){try{if(await auth())await loadRows()}catch(error){document.documentElement.classList.remove("auth-pending");notice("화면 초기화 오류: "+dbError(error),"error")}}
addEventListener("load",init);
</script>
