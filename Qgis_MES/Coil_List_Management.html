<!DOCTYPE html>
<html lang="ko" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코일 관리대장 | HeatPro MES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--line:#dce4ef;--text:#172033;--muted:#6f7c91;--blue:#1769e0;--blue2:#0c55c6;--green:#1a9b45;--red:#e33939;--orange:#e97912;--shadow:0 4px 18px rgba(30,55,90,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px}html.auth-pending body{visibility:hidden}button,input,select{font:inherit}.page{width:100%;padding:20px 22px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.title{font-size:clamp(22px,2.2vw,31px);font-weight:800;letter-spacing:-.4px}.main-btn{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-weight:700;cursor:pointer}.main-btn:hover{border-color:var(--blue);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;min-height:126px;display:flex;align-items:center;gap:16px}.kpi-icon{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:#e8f1ff;color:var(--blue)}.kpi:nth-child(2) .kpi-icon{background:#e8f8ec;color:var(--green)}.kpi:nth-child(3) .kpi-icon{background:#f1eaff;color:#8b4bf0}.kpi:nth-child(4) .kpi-icon{background:#fff1e5;color:var(--orange)}.kpi-label{font-size:14px;font-weight:700;color:#536077}.kpi-value{margin-top:5px;font-size:29px;font-weight:800}.kpi-value small{font-size:15px;margin-left:4px;color:#536077}.kpi-desc{font-size:12px;color:#8490a3;margin-top:5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}.card-title{padding:14px 18px;border-bottom:1px solid var(--line);font-size:18px;font-weight:800}.filters{display:grid;grid-template-columns:1.55fr repeat(4,1fr) auto;gap:12px;align-items:end;padding:16px 18px 18px}.field{min-width:0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#45536a}.date-pair{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:7px}.field input,.field select{width:100%;height:40px;border:1px solid #cdd7e4;border-radius:7px;background:#fff;padding:0 11px;color:var(--text)}.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.12)}.actions{display:flex;gap:8px}.btn{height:40px;padding:0 18px;border:0;border-radius:7px;font-weight:800;cursor:pointer;white-space:nowrap}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}.btn-light{background:#fff;border:1px solid #cdd7e4;color:#445167}.btn-light:hover{border-color:var(--blue);color:var(--blue)}.btn-add{background:var(--blue);color:#fff}.btn-danger{background:#fff;border:1px solid #ffb6b6;color:var(--red)}.btn-edit{background:#fff;border:1px solid #91baff;color:var(--blue)}.status{min-height:34px;padding:8px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.status.ok{color:var(--green)}.status.err{color:var(--red)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.list-title{font-size:18px;font-weight:800}.count{display:inline-block;margin-left:7px;padding:3px 9px;border-radius:999px;background:#e8f1ff;color:var(--blue);font-size:12px}.list-actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto;padding:0 12px 12px}table{width:100%;min-width:1340px;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e1e7ef;padding:8px 7px;text-align:center;white-space:nowrap}th{background:#f7f9fc;color:#536077;font-weight:800;position:sticky;top:0;z-index:1}tbody tr:hover{background:#f8fbff}.left{text-align:left}.use{display:inline-block;padding:3px 9px;border-radius:5px;background:#ddf5e3;color:var(--green);font-weight:800}.unused{display:inline-block;padding:3px 9px;border-radius:5px;background:#edf0f4;color:#68758a;font-weight:800}.manage{display:flex;justify-content:center;gap:6px}.mini{height:28px;padding:0 10px;border-radius:5px;font-size:12px;font-weight:800;cursor:pointer}.empty{padding:42px;color:#8793a6}
.modal{display:none;position:fixed;inset:0;background:rgba(22,32,51,.48);z-index:30;padding:18px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-box{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.22)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-size:19px;font-weight:800}.close{border:0;background:transparent;font-size:24px;cursor:pointer;color:#657187}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;padding:18px}.form-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 18px}.required{color:var(--red)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}.actions{grid-column:1/-1;justify-content:flex-end}}@media(max-width:650px){html,body{font-size:16px}.page{padding:14px 10px 24px}.top{align-items:flex-start}.title{font-size:23px}.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:12px;min-height:105px;gap:10px}.kpi-icon{width:43px;height:43px;flex-basis:43px;font-size:20px}.kpi-value{font-size:23px}.filters{grid-template-columns:1fr;padding:14px 12px}.actions{grid-column:auto;display:grid;grid-template-columns:1fr 1fr}.btn{padding:0 10px}.list-head{align-items:flex-start;flex-direction:column}.list-actions{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:1fr}.date-pair{grid-template-columns:1fr 14px 1fr}}
@media print{body{background:#fff}.top,.filters,.status,.list-actions,.manage,.kpis{display:none!important}.page{padding:0}.card{border:0;box-shadow:none}.table-wrap{overflow:visible;padding:0}table{min-width:0;font-size:9px}th,td{padding:4px;color:#000;background:#fff!important}.card-title,.list-head{border:0;padding:6px 0}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="title">코일 관리대장 (Coil List Management)</div>
    <button class="main-btn" onclick="location.href='main1.html'">▣ 메인메뉴</button>
  </header>

  <section class="kpis">
    <div class="kpi"><div class="kpi-icon">▱</div><div><div class="kpi-label">전체 코일 수</div><div class="kpi-value"><span id="kpiTotal">-</span><small>개</small></div><div class="kpi-desc">사용 중인 코일 수</div></div></div>
    <div class="kpi"><div class="kpi-icon">▣</div><div><div class="kpi-label">코일 사용 작업건수</div><div class="kpi-value"><span id="kpiJobs">-</span><small>건</small></div><div class="kpi-desc">선택 기간 내 코일이 입력된 작업건수</div></div></div>
    <div class="kpi"><div class="kpi-icon">▤</div><div><div class="kpi-label">총 사용수량</div><div class="kpi-value"><span id="kpiQty">-</span><small>EA</small></div><div class="kpi-desc">선택 기간 내 투입수량 합계</div></div></div>
    <div class="kpi"><div class="kpi-icon">◷</div><div><div class="kpi-label">총 사용시간</div><div class="kpi-value"><span id="kpiHours">-</span><small>시간</small></div><div class="kpi-desc">선택 기간 내 가동시간 합계</div></div></div>
  </section>

  <section class="card">
    <div class="card-title">조회 조건</div>
    <div class="filters">
      <div class="field"><label>사용기간 (작업일자 기준)</label><div class="date-pair"><input type="date" id="dateFrom"><span>~</span><input type="date" id="dateTo"></div></div>
      <div class="field"><label>식별코드</label><select id="filterCode"><option value="">전체</option></select></div>
      <div class="field"><label>코일식별번호</label><select id="filterCoil"><option value="">전체</option></select></div>
      <div class="field"><label>적용공정</label><select id="filterProcess"><option value="">전체</option></select></div>
      <div class="field"><label>사용 여부</label><select id="filterActive"><option value="">전체</option><option value="true">사용</option><option value="false">미사용</option></select></div>
      <div class="actions"><button class="btn btn-primary" id="searchBtn">⌕ 조회</button><button class="btn btn-light" id="resetBtn">↻ 초기화</button></div>
    </div>
    <div class="status" id="status">조회 버튼을 눌러주세요.</div>
  </section>

  <section class="card" id="printArea">
    <div class="list-head"><div class="list-title">코일 목록 <span class="count" id="resultCount">총 0건</span></div><div class="list-actions"><button class="btn btn-light" id="csvBtn">⇩ CSV 다운로드</button><button class="btn btn-light" id="pdfBtn">▧ PDF 다운로드</button><button class="btn btn-add" id="newBtn">＋ 신규 등록</button></div></div>
    <div class="table-wrap"><table><thead><tr><th>NO</th><th>코일식별번호</th><th>분류명</th><th>코일규격</th><th>적용공정</th><th>제작일자</th><th>수명수량(EA)</th><th>현재고량(EA)</th><th>사용건수</th><th>사용수량(EA)</th><th>사용시간(시간)</th><th>사용 여부</th><th>관리</th></tr></thead><tbody id="tbody"><tr><td colspan="13" class="empty">조회 버튼을 눌러주세요.</td></tr></tbody></table></div>
  </section>
</div>

<div class="modal" id="editModal"><div class="modal-box"><div class="modal-head"><span id="modalTitle">신규 코일 등록</span><button class="close" id="closeModal">×</button></div><div class="form-grid">
  <div class="field"><label>식별코드 <span class="required">*</span></label><input id="fCode" maxlength="10"></div>
  <div class="field"><label>코일식별번호 <span class="required">*</span></label><input id="fIdentifier" maxlength="50"></div>
  <div class="field"><label>코일규격 <span class="required">*</span></label><input id="fSpec" maxlength="100"></div>
  <div class="field"><label>분류명 <span class="required">*</span></label><input id="fClass" maxlength="200"></div>
  <div class="field"><label>적용공정 <span class="required">*</span></label><select id="fProcess"><option value="고주파열처리">고주파열처리</option><option value="고주파가열">고주파가열</option></select></div>
  <div class="field"><label>제작일자</label><input type="date" id="fManufactured"></div>
  <div class="field"><label>수명수량(EA)</label><input type="number" id="fLife" min="0" step="1"></div>
  <div class="field"><label>현재고량(EA)</label><input type="number" id="fStock" min="0" step="1"></div>
  <div class="field"><label>사용 여부</label><select id="fActive"><option value="true">사용</option><option value="false">미사용</option></select></div>
</div><div class="form-actions"><button class="btn btn-light" id="cancelBtn">취소</button><button class="btn btn-primary" id="saveBtn">저장</button></div></div></div>

<script>
'use strict';
const SUPABASE_URL='https://enxtgbyslnryxvfpjdkc.supabase.co';
const SUPABASE_KEY='sb_publishable_9w9ktk0x4D8I6QodkWOthA_4FcxzMwD';
const QGIS_COMPANY_ID='17f2ff71-20db-49ff-b682-279989776817';
const LOGIN_PAGE_URL='../index.html';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let coilRows=[], productionRows=[], viewRows=[], editingId=null;
const $=id=>document.getElementById(id);
const num=v=>Number(v||0);
const fmt=v=>num(v).toLocaleString('ko-KR',{maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function localDate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function setStatus(msg,type=''){const el=$('status');el.textContent=msg;el.className='status'+(type?' '+type:'')}
async function verifyAccess(){const {data:u,error:e}=await sb.auth.getUser();if(e||!u?.user){location.replace(LOGIN_PAGE_URL);return false}const {data:p,error:pe}=await sb.from('profiles').select('company_id,is_active').eq('user_id',u.user.id).single();if(pe||!p||p.is_active!==true||p.company_id!==QGIS_COMPANY_ID){alert('QGIS 회사 계정만 접근할 수 있습니다.');location.replace(LOGIN_PAGE_URL);return false}document.documentElement.classList.remove('auth-pending');return true}
function defaultDates(){const now=new Date();$('dateFrom').value=`${now.getFullYear()}-01-01`;$('dateTo').value=localDate(now)}
function splitCoils(v){return String(v||'').split(',').map(s=>s.trim()).filter(Boolean)}
function naturalSort(a,b){const pa=String(a.coil_identifier).match(/^([^0-9]*)(\d+)/),pb=String(b.coil_identifier).match(/^([^0-9]*)(\d+)/);if(pa&&pb){const c=pa[1].localeCompare(pb[1],'ko');if(c)return c;return Number(pa[2])-Number(pb[2])}return String(a.coil_identifier).localeCompare(String(b.coil_identifier),'ko',{numeric:true})}
async function loadMaster(){const {data,error}=await sb.from('coils').select('coil_system_id,company_id,identification_code,coil_identifier,coil_spec,classification_name,applied_process,manufactured_date,service_life,stock_quantity,is_active').eq('company_id',QGIS_COMPANY_ID).order('identification_code').order('coil_identifier');if(error)throw error;coilRows=(data||[]).sort(naturalSort);fillOptions()}
function fillOptions(){const code=$('filterCode'),coil=$('filterCoil'),process=$('filterProcess');const old=[code.value,coil.value,process.value];code.innerHTML='<option value="">전체</option>'+[...new Set(coilRows.map(r=>r.identification_code).filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('');coil.innerHTML='<option value="">전체</option>'+coilRows.map(r=>r.coil_identifier).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko',{numeric:true})).map(v=>`<option>${esc(v)}</option>`).join('');process.innerHTML='<option value="">전체</option>'+[...new Set(coilRows.map(r=>r.applied_process).filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('');[code,coil,process].forEach((el,i)=>{if([...el.options].some(o=>o.value===old[i]))el.value=old[i]})}
async function searchData(){setStatus('조회 중입니다.');$('searchBtn').disabled=true;try{if(!coilRows.length)await loadMaster();let q=sb.from('Total_Production_DB').select('production_system_id,company_id,work_date,coil_number,input_quantity,operation_hours,is_active').eq('company_id',QGIS_COMPANY_ID).eq('is_active',true);if($('dateFrom').value)q=q.gte('work_date',$('dateFrom').value);if($('dateTo').value)q=q.lte('work_date',$('dateTo').value);const {data,error}=await q;if(error)throw error;productionRows=data||[];buildView();render();setStatus(`조회가 완료되었습니다. 코일 ${viewRows.length}건입니다.`,'ok')}catch(e){console.error(e);setStatus('조회 실패: '+(e.message||e),'err')}finally{$('searchBtn').disabled=false}}
function buildView(){const stats=new Map();let totalJobs=0,totalQty=0,totalHours=0;productionRows.forEach(p=>{const ids=splitCoils(p.coil_number);if(!ids.length)return;totalJobs++;totalQty+=num(p.input_quantity);totalHours+=num(p.operation_hours);ids.forEach(id=>{const s=stats.get(id)||{jobs:0,qty:0,hours:0};s.jobs++;s.qty+=num(p.input_quantity);s.hours+=num(p.operation_hours);stats.set(id,s)})});const code=$('filterCode').value,coil=$('filterCoil').value,process=$('filterProcess').value,active=$('filterActive').value;viewRows=coilRows.filter(r=>(!code||r.identification_code===code)&&(!coil||r.coil_identifier===coil)&&(!process||r.applied_process===process)&&(!active||String(r.is_active)===active)).map(r=>({...r,...(stats.get(r.coil_identifier)||{jobs:0,qty:0,hours:0})})).sort(naturalSort);$('kpiTotal').textContent=fmt(coilRows.filter(r=>r.is_active).length);$('kpiJobs').textContent=fmt(totalJobs);$('kpiQty').textContent=fmt(totalQty);$('kpiHours').textContent=fmt(totalHours)}
function render(){const tb=$('tbody');$('resultCount').textContent=`총 ${viewRows.length}건`;if(!viewRows.length){tb.innerHTML='<tr><td colspan="13" class="empty">조회된 데이터가 없습니다.</td></tr>';return}tb.innerHTML=viewRows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.coil_identifier)}</b></td><td class="left">${esc(r.classification_name)}</td><td>${esc(r.coil_spec)}</td><td>${esc(r.applied_process)}</td><td>${esc(r.manufactured_date||'')}</td><td>${fmt(r.service_life)}</td><td>${fmt(r.stock_quantity)}</td><td>${fmt(r.jobs)}</td><td>${fmt(r.qty)}</td><td>${fmt(r.hours)}</td><td>${r.is_active?'<span class="use">사용</span>':'<span class="unused">미사용</span>'}</td><td><div class="manage"><button class="mini btn-edit" onclick="openEdit('${r.coil_system_id}')">수정</button><button class="mini btn-danger" onclick="deleteRow('${r.coil_system_id}','${esc(r.coil_identifier)}')">삭제</button></div></td></tr>`).join('')}
function openNew(){editingId=null;$('modalTitle').textContent='신규 코일 등록';['fCode','fIdentifier','fSpec','fClass','fManufactured'].forEach(id=>$(id).value='');$('fProcess').value='고주파열처리';$('fLife').value='10000';$('fStock').value='1';$('fActive').value='true';$('fIdentifier').readOnly=false;$('editModal').classList.add('open')}
function openEdit(id){const r=coilRows.find(x=>x.coil_system_id===id);if(!r)return;editingId=id;$('modalTitle').textContent='코일 정보 수정';$('fCode').value=r.identification_code||'';$('fIdentifier').value=r.coil_identifier||'';$('fSpec').value=r.coil_spec||'';$('fClass').value=r.classification_name||'';$('fProcess').value=r.applied_process||'고주파열처리';$('fManufactured').value=r.manufactured_date||'';$('fLife').value=r.service_life??0;$('fStock').value=r.stock_quantity??0;$('fActive').value=String(r.is_active);$('fIdentifier').readOnly=true;$('editModal').classList.add('open')}
function closeModal(){$('editModal').classList.remove('open')}
async function saveRow(){const payload={company_id:QGIS_COMPANY_ID,identification_code:$('fCode').value.trim(),coil_identifier:$('fIdentifier').value.trim(),coil_spec:$('fSpec').value.trim(),classification_name:$('fClass').value.trim(),applied_process:$('fProcess').value,manufactured_date:$('fManufactured').value||null,service_life:num($('fLife').value),stock_quantity:num($('fStock').value),is_active:$('fActive').value==='true',updated_at:new Date().toISOString()};if(!payload.identification_code||!payload.coil_identifier||!payload.coil_spec||!payload.classification_name){alert('식별코드, 코일식별번호, 코일규격, 분류명은 필수입니다.');return}$('saveBtn').disabled=true;try{let result;if(editingId){result=await sb.from('coils').update(payload).eq('coil_system_id',editingId).eq('company_id',QGIS_COMPANY_ID)}else{payload.created_at=new Date().toISOString();result=await sb.from('coils').insert(payload)}if(result.error)throw result.error;const done=editingId?'수정':'등록';closeModal();await loadMaster();buildView();render();setStatus(`코일 ${payload.coil_identifier} ${done}이 완료되었습니다.`,'ok')}catch(e){console.error(e);setStatus('저장 실패: '+(e.message||e),'err');alert('저장 실패: '+(e.message||e))}finally{$('saveBtn').disabled=false}}
async function deleteRow(id,identifier){if(!confirm(`코일 ${identifier}을(를) 삭제하시겠습니까?`))return;try{const {error}=await sb.from('coils').delete().eq('coil_system_id',id).eq('company_id',QGIS_COMPANY_ID);if(error)throw error;await loadMaster();buildView();render();setStatus(`코일 ${identifier} 삭제가 완료되었습니다.`,'ok')}catch(e){console.error(e);setStatus('삭제 실패: '+(e.message||e),'err');alert('삭제 실패: '+(e.message||e))}}
function resetFilters(){defaultDates();$('filterCode').value='';$('filterCoil').value='';$('filterProcess').value='';$('filterActive').value='';viewRows=[];productionRows=[];$('tbody').innerHTML='<tr><td colspan="13" class="empty">조회 버튼을 눌러주세요.</td></tr>';$('resultCount').textContent='총 0건';['kpiTotal','kpiJobs','kpiQty','kpiHours'].forEach(id=>$(id).textContent='-');setStatus('초기화가 완료되었습니다. 조회 버튼을 눌러주세요.','ok')}
function exportCSV(){if(!viewRows.length){alert('먼저 조회해 주세요.');return}const headers=['NO','코일식별번호','분류명','코일규격','적용공정','제작일자','수명수량(EA)','현재고량(EA)','사용건수','사용수량(EA)','사용시간(시간)','사용 여부'];const rows=[headers, ...viewRows.map((r,i)=>[i+1,r.coil_identifier,r.classification_name,r.coil_spec,r.applied_process,r.manufactured_date||'',r.service_life,r.stock_quantity,r.jobs,r.qty,r.hours,r.is_active?'사용':'미사용'])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`Coil_List_Management_${localDate()}.csv`;a.click();URL.revokeObjectURL(a.href);setStatus('CSV 저장이 완료되었습니다.','ok')}
async function exportPDF(){if(!viewRows.length){alert('먼저 조회해 주세요.');return}$('pdfBtn').disabled=true;try{const canvas=await html2canvas($('printArea'),{scale:1.6,backgroundColor:'#ffffff',useCORS:true});const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),margin=7;const imgW=pw-margin*2,imgH=canvas.height*imgW/canvas.width;let pos=margin,remaining=imgH;const data=canvas.toDataURL('image/png');pdf.addImage(data,'PNG',margin,pos,imgW,imgH);remaining-=ph-margin*2;while(remaining>0){pdf.addPage();pos=margin-(imgH-remaining);pdf.addImage(data,'PNG',margin,pos,imgW,imgH);remaining-=ph-margin*2}pdf.save(`Coil_List_Management_${localDate()}.pdf`);setStatus('PDF 저장이 완료되었습니다.','ok')}catch(e){console.error(e);setStatus('PDF 저장 실패: '+(e.message||e),'err')}finally{$('pdfBtn').disabled=false}}
$('searchBtn').addEventListener('click',searchData);$('resetBtn').addEventListener('click',resetFilters);$('newBtn').addEventListener('click',openNew);$('closeModal').addEventListener('click',closeModal);$('cancelBtn').addEventListener('click',closeModal);$('saveBtn').addEventListener('click',saveRow);$('csvBtn').addEventListener('click',exportCSV);$('pdfBtn').addEventListener('click',exportPDF);$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeModal()});
(async()=>{defaultDates();if(await verifyAccess()){try{await loadMaster();setStatus('조회 조건을 선택한 후 조회 버튼을 눌러주세요.')}catch(e){setStatus('코일 기준정보 불러오기 실패: '+(e.message||e),'err')}}})();
</script>
