<script>
"use strict";

/* =========================================================
   Supabase / 멀티테넌트 연결
   ========================================================= */
const SUPABASE_URL = "https://enxtgbyslnryxvfpjdkc.supabase.co";
const SUPABASE_KEY = "sb_publishable_9w9ktk0x4D8I6QodkWOthA_4FcxzMwD";
const PRODUCTION_TABLE = "Total_Production_DB";
const DEFECT_TABLE = "production_defect_details";
const EQUIPMENT_TABLE = "equipment";
const LOGIN_PAGE_URL = "./index.html";

const YEAR = 2026;
const MAX_DAYS = 31;
const PAGE_SIZE = 1000;
const DEFECT_TYPES = ["외관", "융착", "찍힘", "탈락", "경도", "변형"]; // cont 내부 변수는 융착 수량을 의미

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

let currentUser = null;
let currentProfile = null;
let myChart = null;
let hasData = false;
let lastMonth = null;
let lastDayData = null;
let lastActualDays = 0;
let lastEquipLabel = "전체";

const HOLIDAYS = [
  "2026-01-01",
  "2026-02-16", "2026-02-17", "2026-02-18",
  "2026-03-01", "2026-03-02",
  "2026-05-01", "2026-05-05", "2026-05-25",
  "2026-06-03", "2026-06-06",
  "2026-07-17",
  "2026-08-15", "2026-08-17",
  "2026-09-24", "2026-09-25", "2026-09-26",
  "2026-10-03", "2026-10-05", "2026-10-09",
  "2026-12-25"
];

function getDaysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function getDow(year, month, day) {
  return new Date(year, month - 1, day).getDay();
}

function isHoliday(year, month, day) {
  const dow = getDow(year, month, day);
  if (dow === 0 || dow === 6) return true;
  const key = year + "-" + pad2(month) + "-" + pad2(day);
  return HOLIDAYS.indexOf(key) >= 0;
}

function pad2(value) {
  return String(value).padStart(2, "0");
}

function toNumber(value) {
  const number = Number(String(value == null ? "" : value).replace(/,/g, ""));
  return Number.isFinite(number) ? number : 0;
}

function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function dbErrorMessage(error) {
  if (!error) return "알 수 없는 오류입니다.";
  if (error.code === "42501") return "조회 권한이 없습니다. RLS 정책을 확인해 주세요.";
  return error.message || error.details || error.hint || String(error);
}

function setActionStatus(message, type) {
  const element = document.getElementById("actionStatus");
  element.textContent = message || "";
  element.className = "action-status" + (type ? " " + type : "");
}

function setButtonsDisabled(disabled) {
  document.getElementById("btnSearch").disabled = disabled;
  document.getElementById("btnCsv").disabled = disabled || !hasData;
  document.getElementById("btnPdf").disabled = disabled || !hasData;
}

function redirectToLogin() {
  window.location.replace(LOGIN_PAGE_URL);
}

async function verifyCompanyAccess() {
  const userResult = await sb.auth.getUser();
  const user = userResult.data && userResult.data.user;

  if (userResult.error || !user) {
    redirectToLogin();
    return false;
  }

  const profileResult = await sb
    .from("profiles")
    .select("company_id,is_active")
    .eq("user_id", user.id)
    .single();

  const profile = profileResult.data;

  if (
    profileResult.error ||
    !profile ||
    profile.is_active !== true ||
    !profile.company_id
  ) {
    console.error("회사 권한 확인 실패:", profileResult.error);
    await sb.auth.signOut({ scope: "local" });
    redirectToLogin();
    return false;
  }

  currentUser = user;
  currentProfile = profile;
  document.documentElement.classList.remove("auth-pending");
  return true;
}

sb.auth.onAuthStateChange(function (event) {
  if (event === "SIGNED_OUT") {
    redirectToLogin();
  }
});

async function fetchAllRows(tableName, selectColumns, configureQuery) {
  const result = [];
  let from = 0;

  while (true) {
    let query = sb
      .from(tableName)
      .select(selectColumns)
      .eq("company_id", currentProfile.company_id);

    if (typeof configureQuery === "function") {
      query = configureQuery(query);
    }

    const pageResult = await query.range(from, from + PAGE_SIZE - 1);
    if (pageResult.error) throw pageResult.error;

    const pageRows = pageResult.data || [];
    result.push.apply(result, pageRows);

    if (pageRows.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }

  return result;
}

async function loadMeta() {
  const equipmentRows = await fetchAllRows(
    EQUIPMENT_TABLE,
    "equipment_number,equipment_name,is_active",
    function (query) {
      return query
        .eq("is_active", true)
        .order("equipment_number", { ascending: true });
    }
  );

  const names = [];
  equipmentRows.forEach(function (row) {
    const name = String(row.equipment_name || "").trim();
    if (name && names.indexOf(name) < 0) names.push(name);
  });

  const select = document.getElementById("selEquip");
  select.innerHTML = '<option value="">전체</option>';
  names.forEach(function (name) {
    select.add(new Option(name, name));
  });
}

async function fetchProductionRows(month, equipmentName) {
  const fromDate = YEAR + "-" + pad2(month) + "-01";
  const nextMonth = month === 12
    ? (YEAR + 1) + "-01-01"
    : YEAR + "-" + pad2(month + 1) + "-01";

  return fetchAllRows(
    PRODUCTION_TABLE,
    [
      "production_system_id",
      "work_date",
      "equipment_name",
      "input_quantity",
      "good_quantity",
      "defect_quantity",
      "is_active"
    ].join(","),
    function (query) {
      let filtered = query
        .eq("is_active", true)
        .gte("work_date", fromDate)
        .lt("work_date", nextMonth)
        .order("work_date", { ascending: true })
        .order("production_system_id", { ascending: true });

      if (equipmentName) {
        filtered = filtered.eq("equipment_name", equipmentName);
      }

      return filtered;
    }
  );
}

async function fetchDefectDetails(productionIds) {
  if (!productionIds.length) return [];

  const result = [];
  const chunkSize = 200;

  for (let index = 0; index < productionIds.length; index += chunkSize) {
    const chunk = productionIds.slice(index, index + chunkSize);

    const detailResult = await sb
      .from(DEFECT_TABLE)
      .select("production_system_id,defect_type,defect_quantity,is_active")
      .eq("company_id", currentProfile.company_id)
      .eq("is_active", true)
      .in("production_system_id", chunk);

    if (detailResult.error) throw detailResult.error;
    result.push.apply(result, detailResult.data || []);
  }

  return result;
}

/* =========================================================
   CSV 다운로드
   ========================================================= */
function exportCSV() {
  if (!hasData || !lastDayData) {
    setActionStatus("CSV 실패: 먼저 조회를 진행해 주세요.", "error");
    return;
  }

  const rowsDefinition = [
    { key: "input", label: "생산수량" },
    { key: "good", label: "양품수량" },
    { key: "bad", label: "불량수량" },
    { key: "ppm", label: "불량률(PPM)" },
    { key: "out", label: "외관" },
    { key: "cont", label: "융착" },
    { key: "scratch", label: "찍힘" },
    { key: "drop", label: "탈락" },
    { key: "hard", label: "경도" },
    { key: "deform", label: "변형" },
    { key: "badsum", label: "불량합계" },
    { key: "ppm2", label: "불량률(PPM)" }
  ];

  const header = ["구분", "합계"];
  for (let day = 1; day <= MAX_DAYS; day++) {
    header.push(day + "일");
  }

  const csvRows = [header];

  rowsDefinition.forEach(function (definition) {
    let total = 0;

    for (let day = 1; day <= lastActualDays; day++) {
      total += getVal(lastDayData[day - 1], definition.key);
    }

    const row = [definition.label, total];

    for (let day = 1; day <= MAX_DAYS; day++) {
      if (day > lastActualDays) {
        row.push("");
        continue;
      }

      const dayRow = lastDayData[day - 1];
      row.push(dayRow.hasData ? getVal(dayRow, definition.key) : "");
    }

    csvRows.push(row);
  });

  const csv = csvRows.map(function (row) {
    return row.map(function (cell) {
      let text = String(cell);
      if (text.indexOf(",") >= 0 || text.indexOf('"') >= 0) {
        text = '"' + text.replace(/"/g, '""') + '"';
      }
      return text;
    }).join(",");
  }).join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8;"
  });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  const safeEquipment = lastEquipLabel.replace(/[\\/:*?"<>|]/g, "_");

  anchor.href = url;
  anchor.download =
    "Defect_Rate_Graph_" + YEAR + "_" + pad2(lastMonth) + "_" + safeEquipment + ".csv";

  document.body.appendChild(anchor);
  anchor.click();
  document.body.removeChild(anchor);
  URL.revokeObjectURL(url);

  setActionStatus("CSV 다운로드 완료", "success");
}

/* =========================================================
   A4 가로 1장 벡터 PDF 출력
   - 브라우저 인쇄 엔진: 한글 문자와 표 선을 벡터로 출력
   - Chart.js canvas 대신 인쇄 전용 SVG 그래프 생성
   - 그래프와 1일~31일 전체 상세표를 A4 가로 1장에 고정 배치
   - A4 297×210mm, 인쇄 여백 5mm, 실사용 영역 287×200mm 기준
   ========================================================= */
function escapePrintHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function makeDefectPrintSvg() {
  const width = 1400;
  const height = 300;
  const margin = { left: 72, right: 24, top: 30, bottom: 34 };
  const plotW = width - margin.left - margin.right;
  const plotH = height - margin.top - margin.bottom;
  const points = [];
  let maxValue = 0;

  for (let day = 1; day <= MAX_DAYS; day++) {
    const row = lastDayData[day - 1];
    const value = day <= lastActualDays && row && row.hasData ? getVal(row, "ppm") : null;
    if (value !== null) maxValue = Math.max(maxValue, value);
    points.push({ day: day, value: value });
  }

  const yMax = Math.max(1000, Math.ceil((maxValue * 1.2 || 1000) / 1000) * 1000);
  const x = function (day) {
    return margin.left + ((day - 1) / (MAX_DAYS - 1)) * plotW;
  };
  const y = function (value) {
    return margin.top + plotH - (value / yMax) * plotH;
  };

  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none" role="img" aria-label="불량률 그래프">';
  svg += '<rect width="100%" height="100%" fill="#ffffff"/>';

  for (let index = 0; index <= 5; index++) {
    const value = Math.round(yMax * index / 5);
    const yy = y(value);
    svg += '<line x1="' + margin.left + '" y1="' + yy + '" x2="' + (width - margin.right) + '" y2="' + yy + '" stroke="#d9dfe7" stroke-width="1"/>';
    svg += '<text x="' + (margin.left - 9) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="#425466">' + value.toLocaleString() + '</text>';
  }

  for (let day = 1; day <= MAX_DAYS; day++) {
    const xx = x(day);
    const invalid = day > lastActualDays;
    svg += '<line x1="' + xx + '" y1="' + margin.top + '" x2="' + xx + '" y2="' + (margin.top + plotH) + '" stroke="' + (invalid ? '#e3e3e3' : '#f0f2f5') + '" stroke-width="0.8"/>';
    svg += '<text x="' + xx + '" y="' + (height - 12) + '" text-anchor="middle" font-size="8.5" fill="' + (invalid ? '#a8a8a8' : '#425466') + '">' + day + '</text>';
  }

  const valid = points.filter(function (point) { return point.value !== null; });
  if (valid.length > 1) {
    svg += '<polyline fill="none" stroke="#cc0000" stroke-width="2.4" points="' + valid.map(function (point) {
      return x(point.day) + ',' + y(point.value);
    }).join(' ') + '"/>';
  }

  valid.forEach(function (point) {
    const xx = x(point.day);
    const yy = y(point.value);
    const labelY = Math.max(11, yy - (point.day % 2 === 0 ? 8 : 14));
    svg += '<circle cx="' + xx + '" cy="' + yy + '" r="3.3" fill="#cc0000" stroke="#ffffff" stroke-width="1.2"/>';
    if (point.value > 0) {
      svg += '<text x="' + xx + '" y="' + labelY + '" text-anchor="middle" font-size="7.6" font-weight="700" fill="#cc0000">' + point.value.toLocaleString() + '</text>';
    }
  });

  svg += '<text x="15" y="' + (margin.top + plotH / 2) + '" transform="rotate(-90 15 ' + (margin.top + plotH / 2) + ')" text-anchor="middle" font-size="10" fill="#1a3a5c">불량률(PPM)</text>';
  svg += '<g transform="translate(' + (width - 225) + ',15)"><line x1="0" y1="0" x2="28" y2="0" stroke="#cc0000" stroke-width="2.4"/><text x="34" y="4" font-size="10" fill="#222">불량률(PPM)</text><line x1="130" y1="0" x2="158" y2="0" stroke="#1a3a5c" stroke-width="1.8" stroke-dasharray="7 5"/><text x="165" y="4" font-size="10" fill="#222">목표 0</text></g>';
  svg += '</svg>';
  return svg;
}

function makeDefectPrintTable() {
  const rows = [
    { key: "input", label: "생산수량", group: "" },
    { key: "good", label: "양품수량", group: "" },
    { key: "bad", label: "불량수량", group: "" },
    { key: "ppm", label: "불량률(PPM)", group: "", emphasis: true },
    { key: "out", label: "외관", group: "불량" },
    { key: "cont", label: "융착", group: "불량" },
    { key: "scratch", label: "찍힘", group: "불량" },
    { key: "drop", label: "탈락", group: "불량" },
    { key: "hard", label: "경도", group: "불량" },
    { key: "deform", label: "변형", group: "불량" },
    { key: "badsum", label: "불량합계", group: "" },
    { key: "ppm2", label: "불량률(PPM)", group: "", emphasis: true }
  ];

  let html = '<table class="report-table"><colgroup><col class="col-group"><col class="col-label"><col class="col-total">';
  for (let day = 1; day <= MAX_DAYS; day++) html += '<col class="col-day">';
  html += '</colgroup><thead><tr><th>구분</th><th>항목</th><th>합계</th>';
  for (let day = 1; day <= MAX_DAYS; day++) {
    const invalid = day > lastActualDays;
    html += '<th class="' + (invalid ? 'none' : (isHoliday(YEAR, lastMonth, day) ? 'holiday' : '')) + '">' + day + '</th>';
  }
  html += '</tr></thead><tbody>';

  rows.forEach(function (definition) {
    let total = 0;
    for (let day = 1; day <= lastActualDays; day++) total += getVal(lastDayData[day - 1], definition.key);

    html += '<tr class="' + (definition.emphasis ? 'emphasis' : '') + '">';
    html += '<td class="group-cell">' + escapePrintHtml(definition.group) + '</td>';
    html += '<td class="label-cell">' + escapePrintHtml(definition.label) + '</td>';
    html += '<td class="total-cell">' + total.toLocaleString() + '</td>';

    for (let day = 1; day <= MAX_DAYS; day++) {
      const invalid = day > lastActualDays;
      const row = lastDayData[day - 1];
      const holiday = !invalid && isHoliday(YEAR, lastMonth, day);
      const value = !invalid && row && row.hasData ? getVal(row, definition.key) : null;
      const bad = value !== null && value > 0 && (definition.emphasis || definition.key === "bad" || definition.key === "badsum");
      html += '<td class="' + (invalid ? 'none ' : '') + (holiday ? 'holiday ' : '') + (bad ? 'bad-cell' : '') + '">' + (value === null ? '-' : value.toLocaleString()) + '</td>';
    }
    html += '</tr>';
  });

  html += '</tbody></table>';
  return html;
}

async function exportPDF() {
  if (!hasData || !lastDayData) {
    setActionStatus("PDF 실패: 먼저 조회를 진행해 주세요.", "error");
    return;
  }

  const printWindow = window.open("", "_blank", "width=1400,height=950");
  if (!printWindow) {
    setActionStatus("PDF 실패: 브라우저의 팝업 차단을 해제해 주세요.", "error");
    return;
  }

  const button = document.getElementById("btnPdf");
  const originalText = button.textContent;
  button.textContent = "1장 인쇄 준비 중...";
  setButtonsDisabled(true);
  setActionStatus("A4 가로 1장 벡터 PDF를 준비하는 중입니다.", "loading");

  try {
    printWindow.document.open();
    printWindow.document.write(buildDefectPrintDocument());
    printWindow.document.close();

    const openPrintDialog = function () {
      window.setTimeout(function () {
        printWindow.focus();
        printWindow.print();
      }, 350);
    };

    if (printWindow.document.fonts && printWindow.document.fonts.ready) {
      printWindow.document.fonts.ready.then(openPrintDialog).catch(openPrintDialog);
    } else {
      openPrintDialog();
    }

    setActionStatus("A4 가로 1장 인쇄창을 열었습니다. 1일~31일 전체가 한 장에 출력됩니다.", "success");
  } catch (error) {
    console.error("A4 1장 벡터 PDF 출력 실패:", error);
    if (!printWindow.closed) printWindow.close();
    setActionStatus("PDF 출력 실패: " + dbErrorMessage(error), "error");
  } finally {
    button.textContent = originalText;
    setButtonsDisabled(false);
  }
}

async function loadData() {
  if (!currentProfile) {
    setActionStatus("조회 실패: 로그인 회사 정보를 확인할 수 없습니다.", "error");
    return;
  }

  const month = Number(document.getElementById("selMonth").value);
  const equipment = document.getElementById("selEquip").value;
  const equipmentLabel = equipment || "전체";

  if (month < 1 || month > 12) {
    setActionStatus("조회 실패: 조회 월을 확인해 주세요.", "error");
    return;
  }

  document.getElementById("chartTitle").textContent =
    "불량률 현황 ( " + YEAR + "년 " + month + "월 ) — " + equipmentLabel;
  document.getElementById("tableArea").innerHTML =
    '<div class="status-box"><div class="spinner"></div><br>데이터를 불러오는 중입니다...</div>';

  hasData = false;
  lastDayData = null;
  setButtonsDisabled(true);
  setActionStatus("조회 중입니다.", "loading");

  try {
    const productionRows = await fetchProductionRows(month, equipment);
    const productionIds = productionRows
      .map(function (row) { return row.production_system_id; })
      .filter(Boolean);

    const detailRows = await fetchDefectDetails(productionIds);
    processData(productionRows, detailRows, month, equipment);

    if (productionRows.length) {
      setActionStatus(
        "조회 완료: " + YEAR + "년 " + month + "월 " +
        productionRows.length.toLocaleString() + "건",
        "success"
      );
    } else {
      setActionStatus(
        "조회 완료: 조건에 해당하는 생산실적이 없습니다.",
        "success"
      );
    }
  } catch (error) {
    console.error("불량률 조회 실패:", error);
    showError(dbErrorMessage(error));
    setActionStatus("조회 실패: " + dbErrorMessage(error), "error");
  } finally {
    setButtonsDisabled(false);
  }
}

function showError(message) {
  document.getElementById("tableArea").innerHTML =
    '<div class="status-box error">⚠️ ' + escapeHtml(message) + "</div>";
}

function processData(productionRows, detailRows, month, equipment) {
  lastMonth = month;
  lastEquipLabel = equipment || "전체";
  lastActualDays = getDaysInMonth(YEAR, month);

  const dayData = [];
  for (let index = 0; index < MAX_DAYS; index++) {
    dayData.push({
      input: 0,
      good: 0,
      bad: 0,
      out: 0,
      cont: 0,
      scratch: 0,
      drop: 0,
      hard: 0,
      deform: 0,
      hasData: false
    });
  }

  const detailMap = {};

  detailRows.forEach(function (row) {
    const productionId = row.production_system_id;
    const defectType = String(row.defect_type || "").trim();

    if (!productionId || DEFECT_TYPES.indexOf(defectType) < 0) return;

    if (!detailMap[productionId]) {
      detailMap[productionId] = {
        "외관": 0,
        "융착": 0,
        "찍힘": 0,
        "탈락": 0,
        "경도": 0,
        "변형": 0
      };
    }

    detailMap[productionId][defectType] += toNumber(row.defect_quantity);
  });

  productionRows.forEach(function (row) {
    const workDate = String(row.work_date || "");
    const parts = workDate.split("-");
    if (parts.length < 3) return;

    const day = Number(parts[2]);
    if (day < 1 || day > MAX_DAYS) return;

    const target = dayData[day - 1];
    const detail = detailMap[row.production_system_id] || {};

    target.input += toNumber(row.input_quantity);
    target.good += toNumber(row.good_quantity);
    target.bad += toNumber(row.defect_quantity);
    target.out += toNumber(detail["외관"]);
    target.cont += toNumber(detail["융착"]);
    target.scratch += toNumber(detail["찍힘"]);
    target.drop += toNumber(detail["탈락"]);
    target.hard += toNumber(detail["경도"]);
    target.deform += toNumber(detail["변형"]);
    target.hasData = true;
  });

  lastDayData = dayData;
  hasData = productionRows.length > 0;

  buildChart(dayData, month, lastActualDays);
  buildTable(dayData, month, lastActualDays);
}

function buildChart(dayData, month, actualDays) {
  var labels = [], ppmArr = [];
  for (var d = 1; d <= MAX_DAYS; d++) {
    labels.push(d <= actualDays ? String(d) : '');
    if (d <= actualDays) {
      var dd = dayData[d - 1];
      // 해당 일자에 실제 데이터가 없으면 null (선이 끊기고 빈 칸으로 표시됨)
      ppmArr.push(dd.hasData ? (dd.input > 0 ? Math.round(dd.bad / dd.input * 1000000) : 0) : null);
    } else {
      ppmArr.push(null);
    }
  }

  if (myChart) { myChart.destroy(); myChart = null; }
  var ctx = document.getElementById('myChart').getContext('2d');

  var maxPpm = Math.max.apply(null, ppmArr.filter(function(v){ return v !== null; }).concat([0]));
  var yMax   = Math.max(30000, Math.ceil(maxPpm * 1.3 / 5000) * 5000);
  var yMin   = -Math.round(yMax * 0.08);

  myChart = new Chart(ctx, {
    type: 'line',
    devicePixelRatio: 2,
    data: {
      labels: labels,
      datasets: [
        {
          label: '불량률(PPM)',
          data: ppmArr,
          borderColor: '#cc0000',
          backgroundColor: 'rgba(204,0,0,0.07)',
          borderWidth: 2,
          pointRadius: function(ctx) {
            return ctx.parsed && ctx.parsed.y !== null ? 4 : 0;
          },
          pointBackgroundColor: '#cc0000',
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          tension: 0,
          spanGaps: true,
          segment: {
            borderDash: function(ctx) {
              // 양쪽 끝 중 하나라도 null이었던 구간(보간 구간)은 점선으로 표시
              var p0 = ctx.p0.parsed, p1 = ctx.p1.parsed;
              var raw0 = ppmArr[ctx.p0DataIndex];
              var raw1 = ppmArr[ctx.p1DataIndex];
              return (raw0 === null || raw1 === null) ? [4, 4] : undefined;
            },
            borderColor: function(ctx) {
              var raw0 = ppmArr[ctx.p0DataIndex];
              var raw1 = ppmArr[ctx.p1DataIndex];
              return (raw0 === null || raw1 === null) ? '#bbb' : '#cc0000';
            }
          }
        },
        {
          label: '목표(0PPM)',
          data: Array(MAX_DAYS).fill(0),
          borderColor: '#1a3a5c',
          borderWidth: 1.5,
          borderDash: [6, 4],
          pointRadius: 0,
          tension: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      resizeDelay: 0,
      clip: false,
      layout: { padding: { top: 24 } },
      scales: {
        x: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 10 } } },
        y: {
          min: yMin,
          max: yMax,
          grid: { color: '#f0f0f0' },
          ticks: {
            font: { size: 10 },
            callback: function (v) {
              if (v < 0) return '';
              return v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v;
            }
          }
        }
      },
      plugins: {
        legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 14 } },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              return ctx.dataset.label + ': ' +
                (ctx.parsed.y !== null ? ctx.parsed.y.toLocaleString() + ' PPM' : '—');
            }
          }
        }
      }
    },
    plugins: [{
      id: 'ppmLabel',
      afterDatasetsDraw: function (chart) {
        var ds   = chart.data.datasets[0];
        var meta = chart.getDatasetMeta(0);
        var c2   = chart.ctx;
        c2.save();
        c2.font      = 'bold 9px Malgun Gothic, sans-serif';
        c2.fillStyle = '#cc0000';
        c2.textAlign = 'center';
        meta.data.forEach(function (pt, i) {
          var v = ds.data[i];
          if (v === null || v === undefined || v === 0) return;
          c2.fillText(v.toLocaleString(), pt.x, pt.y - 10);
        });
        c2.restore();
      }
    }]
  });
}

function buildTable(dayData, month, actualDays) {
  // 열 너비 고정: 구분(2칸 분량), 합계, 날짜 31개
  var colgroup = '<colgroup>'
    + '<col style="width:3.76%">'   // 구분(불량 그룹)
    + '<col style="width:6.84%">'   // 구분(소항목/라벨)
    + '<col style="width:4.62%">';  // 합계
  for (var ci = 1; ci <= MAX_DAYS; ci++) {
    colgroup += '<col style="width:2.735%">';  // 날짜 31개 (합계 약 84.8%)
  }
  colgroup += '</colgroup>';

  // 헤더 행 — "구분"을 colspan=2로 병합 (바디 일반행과 동일 구조)
  var thRow = '<tr><th colspan="2">구분</th><th>합계</th>';
  for (var d = 1; d <= MAX_DAYS; d++) {
    if (d > actualDays) {
      thRow += '<th class="th-none">' + d + '</th>';
    } else if (isHoliday(YEAR, month, d)) {
      thRow += '<th class="th-holiday">' + d + '</th>';
    } else {
      thRow += '<th>' + d + '</th>';
    }
  }
  thRow += '</tr>';

  var ROWS = [
    { key: 'input',   label: '생산수량',    sub: false, ppm: false },
    { key: 'good',    label: '양품수량',    sub: false, ppm: false },
    { key: 'bad',     label: '불량수량',    sub: false, ppm: false },
    { key: 'ppm',     label: '불량률(PPM)', sub: false, ppm: true  },
    { key: 'out',     label: '외관',        sub: true,  ppm: false },
    { key: 'cont',    label: '융착',        sub: true,  ppm: false },
    { key: 'scratch', label: '찍힘',        sub: true,  ppm: false },
    { key: 'drop',    label: '탈락',        sub: true,  ppm: false },
    { key: 'hard',    label: '경도',        sub: true,  ppm: false },
    { key: 'deform',  label: '변형',        sub: true,  ppm: false },
    { key: 'badsum',  label: '불량합계',    sub: false, ppm: false },
    { key: 'ppm2',    label: '불량률(PPM)', sub: false, ppm: true  }
  ];

  var SUB_COUNT = 6;
  var html = '<table>' + colgroup + '<thead>' + thRow + '</thead><tbody>';

  ROWS.forEach(function (f, fi) {
    var isFirstSub = f.sub && (fi === 0 || !ROWS[fi - 1].sub);

    // 합계
    var total = 0;
    for (var d2 = 1; d2 <= actualDays; d2++) {
      total += getVal(dayData[d2 - 1], f.key);
    }

    html += '<tr' + (f.ppm ? ' class="row-ppm"' : '') + '>';

    // 구분열 — 일반 행은 colspan=2로 병합(라벨 잘림 방지), 불량 소항목 행만 분리 유지
    if (isFirstSub) {
      html += '<td class="col-group" rowspan="' + SUB_COUNT + '">불량</td>';
      html += '<td class="col-sub">' + f.label + '</td>';
    } else if (f.sub) {
      html += '<td class="col-sub">' + f.label + '</td>';
    } else {
      var labelStyle = f.ppm ? ' style="color:#cc0000;"' : '';
      html += '<td colspan="2" class="col-label"' + labelStyle + '>' + f.label + '</td>';
    }

    // 합계열
    var totBad = f.ppm ? total > 0 : (f.key === 'bad' || f.key === 'badsum') && total > 0;
    html += '<td class="total-col' + (totBad ? ' td-bad' : '') + '">' + total.toLocaleString() + '</td>';

    // 일별 셀
    for (var d3 = 1; d3 <= MAX_DAYS; d3++) {
      if (d3 > actualDays) {
        html += '<td class="td-none">—</td>';
        continue;
      }
      var dd3     = dayData[d3 - 1];
      var v       = getVal(dd3, f.key);
      var holiday = isHoliday(YEAR, month, d3);
      var hasData = dd3.hasData;
      var isBad   = hasData && ((f.ppm && v > 0) || ((f.key === 'bad' || f.key === 'badsum') && v > 0));
      var cls = [];
      if (holiday) cls.push('td-holiday');
      if (isBad)   cls.push('td-bad');
      html += '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>';
      html += hasData ? v.toLocaleString() : '—';
      html += '</td>';
    }
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('tableArea').innerHTML = html;
}

function getVal(dd, key) {
  switch (key) {
    case 'input':   return dd.input;
    case 'good':    return dd.good;
    case 'bad':     return dd.bad;
    case 'ppm':
    case 'ppm2':    return dd.input > 0 ? Math.round(dd.bad / dd.input * 1000000) : 0;
    case 'out':     return dd.out;
    case 'cont':    return dd.cont;
    case 'scratch': return dd.scratch;
    case 'drop':    return dd.drop;
    case 'hard':    return dd.hard;
    case 'deform':  return dd.deform;
    case 'badsum':  return dd.out + dd.cont + dd.scratch + dd.drop + dd.hard + dd.deform;
    default:        return 0;
  }
}
</script>
