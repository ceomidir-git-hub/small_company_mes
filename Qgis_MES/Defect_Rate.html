<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>불량률현황 | HeatPro MES</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#185FA5;--blue-lt:#E6F1FB;--blue-dk:#0C447C;
  --green:#3B6D11;--green-lt:#EAF3DE;--green-dk:#27500A;
  --amber:#854F0B;--amber-lt:#FAEEDA;
  --red:#A32D2D;--red-lt:#FCEBEB;
  --pink:#72243E;--pink-lt:#FBEAF0;
  --gray:#5F5E5A;--gray-lt:#F1EFE8;--gray-bd:#D3D1C7;
  --bg:#F8F7F4;--white:#FFFFFF;--text:#2C2C2A;--text-sub:#888780;
}
body{font-family:'Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
.top-header{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--blue);text-decoration:none;}
.logo svg{width:20px;height:20px;}
nav{display:flex;gap:4px;}
nav a{font-size:12px;color:var(--text-sub);text-decoration:none;padding:5px 10px;border-radius:6px;border:1px solid transparent;}
nav a:hover{background:var(--gray-lt);color:var(--text);}
nav a.active{background:var(--blue-lt);color:var(--blue-dk);border-color:#B5D4F4;font-weight:500;}
.container{max-width:1280px;margin:0 auto;padding:20px 20px 48px;width:100%;}
.page-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.page-title svg{width:20px;height:20px;color:var(--pink);flex-shrink:0;}
.page-title h1{font-size:18px;font-weight:700;}
.page-title .sub{font-size:12px;color:var(--text-sub);}
.badge-wrap{margin-left:auto;display:flex;gap:6px;align-items:center;}
.year-badge{background:var(--blue-lt);color:var(--blue-dk);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;}
.unit-badge{background:var(--pink-lt);color:var(--pink);font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;}
.filter-card{background:var(--white);border:1px solid var(--gray-bd);border-radius:10px;padding:13px 16px;margin-bottom:12px;}
.filter-label{font-size:11px;font-weight:600;color:var(--text-sub);letter-spacing:.05em;margin-bottom:9px;}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.filter-row:last-child{margin-bottom:0;}
.fg{display:flex;align-items:center;gap:5px;}
.fg label{font-size:12px;color:var(--text-sub);white-space:nowrap;}
.fg input[type=date],.fg select{height:32px;border:1px solid var(--gray-bd);border-radius:6px;padding:0 8px;font-size:12px;color:var(--text);background:var(--white);outline:none;}
.fg input[type=date]{width:125px;}
.fg select{min-width:100px;}
.fg input:focus,.fg select:focus{border-color:var(--blue);}
.sep{font-size:12px;color:var(--text-sub);}
.btn-row{display:flex;gap:6px;margin-left:auto;}
.btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 13px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--gray-bd);background:var(--white);color:var(--text-sub);transition:background .1s;}
.btn:hover{background:var(--gray-lt);}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn-today{background:var(--green-lt);color:var(--green-dk);border-color:#C0DD97;}
.btn-today:hover{background:#C0DD97;}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-dk);}
.btn:disabled{opacity:.55;cursor:default;}
.dash-card{background:var(--white);border:1px solid var(--gray-bd);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.dash-title{font-size:12px;font-weight:600;color:var(--text);}
.period-badge{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500;}
.pb-single{background:var(--green-lt);color:var(--green-dk);}
.pb-range{background:var(--blue-lt);color:var(--blue-dk);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.kpi-item{background:var(--gray-lt);border-radius:8px;padding:9px 11px;}
.kpi-label{font-size:10px;color:var(--text-sub);margin-bottom:3px;white-space:nowrap;}
.kpi-val{font-size:16px;font-weight:700;color:var(--text);}
.kpi-unit{font-size:10px;color:var(--text-sub);margin-left:1px;}
.table-card{background:var(--white);border:1px solid var(--gray-bd);border-radius:10px;overflow:hidden;}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--gray-bd);gap:8px;flex-wrap:wrap;}
.t-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px;}
.cnt-badge{background:var(--blue-lt);color:var(--blue-dk);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;}
.toolbar-buttons{display:flex;gap:6px;}
.table-wrap{overflow-x:auto;overflow-y:auto;max-height:420px;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:1100px;}
thead{position:sticky;top:0;z-index:10;}
thead th{padding:6px 4px;text-align:center;font-size:10px;font-weight:600;background:var(--gray-lt);color:var(--text-sub);border-bottom:1px solid var(--gray-bd);border-right:1px solid var(--gray-bd);white-space:nowrap;}
thead th.th-db{background:#E6F1FB;color:var(--blue-dk);}
thead th.th-input{background:#FAEEDA;color:#633806;}
thead th.th-calc{background:#FBEAF0;color:var(--pink);}
thead th:last-child{border-right:none;}
tbody td{padding:5px 4px;text-align:center;border-bottom:1px solid #EEECEA;border-right:1px solid #EEECEA;color:var(--text);font-size:11px;}
tbody td:last-child{border-right:none;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#FAFAF8;}
.td-db{background:#EEF7FD;color:var(--blue-dk);font-weight:500;}
.td-calc{background:#FBEAF0;color:var(--pink);font-weight:500;}
.td-calc-bad{background:#FCEBEB;color:var(--red);font-weight:600;}
.td-input{border:1px solid transparent;border-radius:3px;padding:2px 3px;font-size:11px;width:100%;background:transparent;color:var(--text);text-align:center;outline:none;font-family:inherit;min-width:34px;}
.td-input:hover{border-color:var(--gray-bd);background:var(--gray-lt);}
.td-input:focus{border-color:var(--blue);background:var(--white);}
.td-input.modified{border-color:#EF9F27;background:#FAEEDA;}
.save-btn{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:3px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--blue);background:var(--blue-lt);color:var(--blue-dk);transition:background .1s;}
.save-btn:hover{background:#B5D4F4;}
.save-btn.saved{border-color:var(--green);background:var(--green-lt);color:var(--green-dk);}
.save-btn.saving{opacity:.6;pointer-events:none;}
.status-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-top:1px solid var(--gray-bd);font-size:11px;color:var(--text-sub);}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-ok{background:var(--green);}
.dot-loading{background:var(--amber);animation:pulse 1s infinite;}
.dot-error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2C2C2A;color:#fff;font-size:13px;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.toast.show{opacity:1;}
#loadingOverlay{position:fixed;inset:0;background:rgba(255,255,255,.72);display:none;align-items:center;justify-content:center;color:var(--blue-dk);font-weight:600;z-index:9998;}
@media(max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .filter-row{flex-wrap:wrap;}
  .top-header{padding:0 12px;}
  nav{display:none;}
  .container{padding:14px 10px 32px;}
}

/* ── 가독성 개선 ── */
body{font-size:15px;font-weight:500;color:#1F2937;}
.logo{font-size:16px;font-weight:800;}
nav a{font-size:13px;font-weight:600;}
.page-title h1{font-size:21px;font-weight:800;color:#222;}
.page-title .sub{font-size:13px;font-weight:600;color:#6B7280;}
.year-badge,.unit-badge{font-size:12px;font-weight:700;}
.filter-label{font-size:12px;font-weight:700;color:#5B6472;}
.fg label{font-size:13px;font-weight:700;color:#555F6E;}
.fg input[type=date],.fg select{font-size:13px;font-weight:600;color:#222;}
.btn{font-size:13px;font-weight:700;}
.dash-title{font-size:14px;font-weight:800;}
.period-badge{font-size:12px;font-weight:700;}
.kpi-label{font-size:12px;font-weight:700;color:#626B78;}
.kpi-val{font-size:20px;font-weight:800;color:#1F2937;}
.kpi-unit{font-size:11px;font-weight:700;}
.t-title{font-size:15px;font-weight:800;}
.cnt-badge{font-size:12px;font-weight:700;}
table{font-size:12px;min-width:1240px;}
thead th{font-size:11px;font-weight:800;color:#4B5563;padding:8px 5px;}
tbody td{font-size:12px;font-weight:600;color:#26313F;padding:7px 5px;}
.td-input{font-size:12px;font-weight:700;}
.save-btn{font-size:11px;font-weight:800;}
.status-bar{font-size:12px;font-weight:600;}

/* ── PDF 전용 출력 영역: 화면에는 노출하지 않음 ── */
#pdfPrintRoot{
  position:fixed;
  left:-99999px;
  top:0;
  width:1600px;
  background:#fff;
  color:#111827;
  z-index:-1;
}
.pdf-page{
  width:1600px;
  background:#fff;
  padding:22px 24px 18px;
  font-family:'Malgun Gothic','Noto Sans KR',sans-serif;
}
.pdf-main-title{
  text-align:center;
  font-size:24px;
  font-weight:900;
  color:#1F2937;
  margin-bottom:5px;
}
.pdf-period{
  text-align:center;
  font-size:14px;
  font-weight:700;
  color:#4B5563;
  margin-bottom:14px;
}
.pdf-kpi-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}
.pdf-kpi{
  border:1px solid #CBD5E1;
  background:#F8FAFC;
  border-radius:7px;
  padding:10px 12px;
}
.pdf-kpi-label{
  font-size:12px;
  font-weight:800;
  color:#64748B;
  margin-bottom:4px;
}
.pdf-kpi-value{
  font-size:20px;
  font-weight:900;
  color:#111827;
}
.pdf-section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
  font-weight:900;
  color:#1F2937;
  margin:2px 0 7px;
}
.pdf-table{
  width:100%;
  min-width:0;
  border-collapse:collapse;
  table-layout:fixed;
}
.pdf-table th,
.pdf-table td{
  border:1px solid #94A3B8;
  padding:5px 3px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#111827;
}
.pdf-table thead th{
  position:static;
  background:#E5E7EB;
  font-size:9.5px;
  font-weight:900;
}
.pdf-table thead th.pdf-db{background:#DBEAFE;color:#1E3A8A;}
.pdf-table thead th.pdf-type{background:#FEF3C7;color:#78350F;}
.pdf-table thead th.pdf-calc{background:#FCE7F3;color:#831843;}
.pdf-table tbody td{
  font-size:9.5px;
  font-weight:700;
  background:#fff;
}
.pdf-table tbody td.pdf-db{background:#EFF6FF;}
.pdf-table tbody td.pdf-calc{background:#FDF2F8;font-weight:900;}
.pdf-page-number{
  text-align:right;
  margin-top:6px;
  font-size:10px;
  font-weight:700;
  color:#64748B;
}


/* =========================================================
   A4 가로형 화면 최적화
   기준 비율 : 297mm : 210mm = 1.414 : 1
   PC 화면 기준 최대폭 1485px (= 297mm × 5px/mm 가상환산)
   조회표는 17열 합계 100%로 고정하여 내부 스크롤을 제거합니다.
   ========================================================= */
@media screen and (min-width:901px){
  html,body{
    width:100%;
    overflow-x:hidden;
  }

  .top-header{
    height:44px;
    padding:0 16px;
  }

  .container{
    width:calc(100vw - 16px);
    max-width:1485px;
    margin:0 auto;
    padding:8px 0 12px;
  }

  .page-title{
    margin-bottom:7px;
  }
  .page-title h1{
    font-size:18px;
  }
  .page-title .sub{
    font-size:11px;
  }

  .filter-card{
    padding:8px 10px;
    margin-bottom:7px;
    border-radius:7px;
  }
  .filter-label{
    margin-bottom:5px;
    font-size:10px;
  }
  .filter-row{
    gap:5px;
    margin-bottom:5px;
  }
  .fg{
    gap:3px;
  }
  .fg label{
    font-size:10px;
  }
  .fg input[type=date],
  .fg select{
    height:27px;
    font-size:10px;
    padding:0 5px;
  }
  .fg input[type=date]{
    width:116px;
  }
  .fg select{
    min-width:82px;
  }
  .btn{
    height:27px;
    padding:0 9px;
    font-size:10px;
  }

  .dash-card{
    padding:7px 9px;
    margin-bottom:7px;
    border-radius:7px;
  }
  .dash-header{
    margin-bottom:6px;
  }
  .dash-title{
    font-size:11px;
  }
  .period-badge{
    font-size:9px;
  }
  .kpi-grid{
    gap:5px;
  }
  .kpi-item{
    padding:6px 8px;
    border-radius:6px;
  }
  .kpi-label{
    font-size:9px;
    margin-bottom:1px;
  }
  .kpi-val{
    font-size:16px;
    line-height:1.1;
  }
  .kpi-unit{
    font-size:8px;
  }

  .table-card{
    border-radius:7px;
  }
  .table-toolbar{
    padding:6px 9px;
    min-height:34px;
  }
  .t-title{
    font-size:11px;
  }
  .cnt-badge{
    font-size:9px;
  }
  .toolbar-buttons .btn{
    height:25px !important;
    font-size:9px !important;
  }

  /* 내부 스크롤 완전 제거 */
  .table-wrap{
    width:100%;
    max-height:none;
    overflow:visible;
    -webkit-overflow-scrolling:auto;
  }

  #defectTable{
    width:100%;
    min-width:0 !important;
    table-layout:fixed;
    border-collapse:collapse;
  }

  #defectTable thead th{
    padding:4px 2px;
    height:26px;
    font-size:9px;
    line-height:1.15;
    white-space:normal;
    word-break:keep-all;
  }

  #defectTable tbody td{
    padding:3px 2px;
    min-height:25px;
    font-size:9px;
    line-height:1.15;
  }

  #defectTable .td-input{
    width:100%;
    min-width:0 !important;
    height:22px;
    padding:1px;
    font-size:9px;
  }

  #defectTable .save-btn{
    height:21px;
    padding:0 4px;
    font-size:9px;
  }

  #defectTable .defect-note-cell{
    text-align:left;
    white-space:normal;
    word-break:break-all;
    overflow:visible;
    text-overflow:clip;
    padding:3px 5px;
    font-size:8.5px;
    line-height:1.25;
    color:#7C2D12;
    background:#FFF9F5;
  }

  .status-bar{
    padding:5px 9px;
    font-size:9px;
  }
}

/* 화면 열 폭 합계 = 100%
   작업일 6
   고객사 7
   품명 8
   품번 8
   DB 3열 = 14.1
   불량 6열 = 21
   불량합계 5
   PPM 6
   불량내용 20
   저장 4.9
*/
#defectTable col.c-date{width:6%;}
#defectTable col.c-cust{width:7%;}
#defectTable col.c-prod{width:8%;}
#defectTable col.c-part{width:8%;}
#defectTable col.c-db{width:4.7%;}
#defectTable col.c-type{width:3.5%;}
#defectTable col.c-sum{width:5%;}
#defectTable col.c-ppm{width:6%;}
#defectTable col.c-note{width:20%;}
#defectTable col.c-save{width:4.9%;}

</style>

      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    HeatPro MES
  </a>
  <nav>

</header>

<main class="container" id="pdfArea">
  <div class="page-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>

<script>
"use strict";

const SUPABASE_URL = "https://enxtgbyslnryxvfpjdkc.supabase.co";
const SUPABASE_KEY = "sb_publishable_9w9ktk0x4D8I6QodkWOthA_4FcxzMwD";

const PRODUCTION_TABLE = "Total_Production_DB";
const DEFECT_TABLE = "production_defect_details";
const LOGIN_PAGE_URL = "../index.html";

const DEFECT_TYPES = ["외관","융착","찍힘","탈락","경도","변형"];
const PAGE_SIZE = 1000;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

let currentUser = null;
let currentProfile = null;
let queryRows = [];
let productMaster = {};

function pad2(n){ return String(n).padStart(2,"0"); }
function fmtDate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fmtMonthFirst(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-01"; }
function toN(v){
  const n = Number(String(v == null ? "" : v).replace(/,/g,""));
  return Number.isFinite(n) ? n : 0;
}
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function dbErrorMessage(error){
  if(!error) return "알 수 없는 오류";
  return error.message || error.details || error.hint || String(error);
}
function showLoading(message){
  const el = document.getElementById("loadingOverlay");
  el.textContent = message || "처리 중입니다...";
  el.style.display = "flex";
}
function hideLoading(){
  document.getElementById("loadingOverlay").style.display = "none";
}
function setButtonsDisabled(disabled){
  ["btnToday","btnReset","btnQuery","btnCsv","btnPdf"].forEach(function(id){
    const el = document.getElementById(id);
    if(el) el.disabled = disabled;
  });
}
function setStatus(type,msg){
  document.getElementById("sDot").className =
    "sdot " + (type==="loading" ? "dot-loading" : type==="error" ? "dot-error" : "dot-ok");
  document.getElementById("sText").textContent = msg;
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); },3500);
}
function redirectToLogin(){
  window.location.replace(LOGIN_PAGE_URL);
}

async function verifyCompanyAccess(){
  const { data:userData, error:userError } = await sb.auth.getUser();
  const user = userData && userData.user;

  if(userError || !user){
    redirectToLogin();
    return false;
  }

  const { data:profile, error:profileError } = await sb
    .from("profiles")
    .select("company_id,is_active")
    .eq("user_id",user.id)
    .single();

  if(profileError || !profile || profile.is_active !== true || !profile.company_id){
    console.error("회사 권한 확인 실패:",profileError);
    await sb.auth.signOut({scope:"local"});
    redirectToLogin();
    return false;
  }

  currentUser = user;
  currentProfile = profile;
  return true;
}

sb.auth.onAuthStateChange(function(event){
  if(event === "SIGNED_OUT") redirectToLogin();
});

async function fetchAll(tableName, columns, applyQuery){
  let from = 0;
  const result = [];

  while(true){
    let query = sb
      .from(tableName)
      .select(columns)
      .eq("company_id",currentProfile.company_id);

    query = applyQuery(query);
    query = query.range(from,from+PAGE_SIZE-1);

    const {data,error} = await query;
    if(error) throw error;

    const page = data || [];
    result.push.apply(result,page);

    if(page.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }

  return result;
}

function fillSel(id,arr){
  const sel = document.getElementById(id);
  const current = sel.value;
  const unique = Array.from(new Set(arr.filter(Boolean))).sort(function(a,b){
    return String(a).localeCompare(String(b),"ko");
  });

  sel.innerHTML = '<option value="">전체</option>' +
    unique.map(function(v){
      return '<option value="'+esc(v)+'">'+esc(v)+'</option>';
    }).join("");

  sel.value = unique.includes(current) ? current : "";
}

async function loadMeta(){
  const rows = await fetchAll(
    PRODUCTION_TABLE,
    "customer_name,item_name,item_number,equipment_name,is_active",
    function(query){
      return query
        .eq("is_active",true)
        .order("customer_name",{ascending:true})
        .order("item_name",{ascending:true})
        .order("item_number",{ascending:true});
    }
  );

  const customers = [];
  const equipment = [];
  productMaster = {};

  rows.forEach(function(r){
    const customer = String(r.customer_name || "").trim();
    const product = String(r.item_name || "").trim();
    const partNo = String(r.item_number || "").trim();
    const equip = String(r.equipment_name || "").trim();

    if(customer) customers.push(customer);
    if(equip) equipment.push(equip);

    if(customer && product){
      if(!productMaster[customer]) productMaster[customer] = {};
      if(!productMaster[customer][product]) productMaster[customer][product] = [];
      if(partNo && !productMaster[customer][product].includes(partNo)){
        productMaster[customer][product].push(partNo);
      }
    }
  });

  fillSel("selCust",customers);
  fillSel("selEquip",equipment);
  refreshProducts();
  refreshPartNos();
}

function refreshProducts(){
  const customer = document.getElementById("selCust").value;
  const products = [];

  if(customer && productMaster[customer]){
    products.push.apply(products,Object.keys(productMaster[customer]));
  }else{
    Object.keys(productMaster).forEach(function(c){
      products.push.apply(products,Object.keys(productMaster[c] || {}));
    });
  }

  fillSel("selProd",products);
}

function refreshPartNos(){
  const customer = document.getElementById("selCust").value;
  const product = document.getElementById("selProd").value;
  const parts = [];

  Object.keys(productMaster).forEach(function(c){
    if(customer && c !== customer) return;

    Object.keys(productMaster[c] || {}).forEach(function(p){
      if(product && p !== product) return;
      parts.push.apply(parts,productMaster[c][p] || []);
    });
  });

  fillSel("selPartNo",parts);
}

async function fetchDefectDetails(productionIds){
  if(!productionIds.length) return [];

  const result = [];
  const chunkSize = 200;

  for(let i=0;i<productionIds.length;i+=chunkSize){
    const chunk = productionIds.slice(i,i+chunkSize);

    const {data,error} = await sb
      .from(DEFECT_TABLE)
      .select("production_system_id,defect_type,defect_quantity,remarks")
      .eq("company_id",currentProfile.company_id)
      .eq("is_active",true)
      .in("production_system_id",chunk);

    if(error) throw error;
    result.push.apply(result,data || []);
  }

  return result;
}

async function doQuery(){
  if(!currentProfile){
    showToast("로그인 회사 정보를 확인할 수 없습니다.");
    return;
  }

  const from = document.getElementById("fFrom").value;
  const to = document.getElementById("fTo").value;
  const cust = document.getElementById("selCust").value;
  const prod = document.getElementById("selProd").value;
  const partNo = document.getElementById("selPartNo").value;
  const eq = document.getElementById("selEquip").value;

  if(!from && !to && !cust && !prod && !partNo && !eq){
    showToast("조회 조건을 하나 이상 선택하세요.");
    return;
  }

  setButtonsDisabled(true);
  showLoading("불량률 자료를 조회하는 중입니다...");
  setStatus("loading","데이터 불러오는 중...");

  try{
    const productionRows = await fetchAll(
      PRODUCTION_TABLE,
      [
        "production_system_id",
        "company_id",
        "work_date",
        "customer_name",
        "item_name",
        "item_number",
        "equipment_name",
        "equipment_number",
        "input_quantity",
        "good_quantity",
        "defect_quantity",
        "is_active"
      ].join(","),
      function(query){
        let filtered = query.eq("is_active",true);

        if(from) filtered = filtered.gte("work_date",from);
        if(to) filtered = filtered.lte("work_date",to);
        if(cust) filtered = filtered.eq("customer_name",cust);
        if(prod) filtered = filtered.eq("item_name",prod);
        if(partNo) filtered = filtered.eq("item_number",partNo);
        if(eq) filtered = filtered.eq("equipment_name",eq);

        return filtered
          .order("work_date",{ascending:true})
          .order("customer_name",{ascending:true})
          .order("item_name",{ascending:true})
          .order("production_system_id",{ascending:true});
      }
    );

    const ids = productionRows
      .map(function(r){ return r.production_system_id; })
      .filter(Boolean);

    const details = await fetchDefectDetails(ids);
    const detailMap = {};

    details.forEach(function(d){
      if(!detailMap[d.production_system_id]){
        detailMap[d.production_system_id] = {
          quantities:{},
          remarks:{}
        };
      }

      const target = detailMap[d.production_system_id];
      target.quantities[d.defect_type] = toN(d.defect_quantity);

      const remark = String(d.remarks || "").trim();
      if(remark){
        target.remarks[d.defect_type] = remark;
      }
    });

    queryRows = productionRows.map(function(r){
      const detail = detailMap[r.production_system_id] || {
        quantities:{},
        remarks:{}
      };
      const row = Object.assign({},r);

      DEFECT_TYPES.forEach(function(type){
        row[type] = toN(detail.quantities[type]);
      });

      row.defect_content = DEFECT_TYPES
        .filter(function(type){
          return detail.remarks[type];
        })
        .map(function(type){
          return type + " : " + detail.remarks[type];
        })
        .join(" / ");

      return row;
    });

    renderTable(from,to,cust,prod,partNo,eq,queryRows);
    setStatus("ok","조회 완료 · "+queryRows.length+"건");
    showToast("조회 완료: "+queryRows.length+"건");
  }catch(error){
    console.error(error);
    queryRows = [];
    renderTable(from,to,cust,prod,partNo,eq,[]);
    setStatus("error","조회 실패: "+dbErrorMessage(error));
    showToast("조회 실패: "+dbErrorMessage(error));
  }finally{
    hideLoading();
    setButtonsDisabled(false);
  }
}

function renderTable(from,to,cust,prod,partNo,eq,rows){
  const isSingle = from === to && from !== "";
  const condParts = [];

  if(from && to) condParts.push(from + (isSingle ? "" : " ~ "+to));
  else if(from) condParts.push(from+" ~");
  else if(to) condParts.push("~ "+to);
  if(cust) condParts.push(cust);
  if(prod) condParts.push(prod);
  if(partNo) condParts.push(partNo);
  if(eq) condParts.push(eq);

  document.getElementById("dashTitle").textContent = condParts.join(" · ") || "전체";
  document.getElementById("periodBadge").textContent = isSingle ? "당일" : "기간 집계";
  document.getElementById("periodBadge").className =
    "period-badge " + (isSingle ? "pb-single" : "pb-range");
  document.getElementById("tCount").textContent = rows.length+"건";

  if(rows.length === 0){
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="17" style="padding:30px;text-align:center;color:var(--text-sub);font-size:12px;">조회된 데이터가 없습니다.</td></tr>';
    updateDash();
    return;
  }

  const html = rows.map(function(r,idx){
    const dbInput = toN(r.input_quantity);
    const dbGood = toN(r.good_quantity);
    const dbBad = toN(r.defect_quantity);
    const badSum = DEFECT_TYPES.reduce(function(sum,type){ return sum+toN(r[type]); },0);
    const ppm = dbInput > 0 ? Math.round(dbBad/dbInput*1000000) : 0;

    return '<tr data-idx="'+idx+'"'
      +' data-id="'+esc(r.production_system_id)+'"'
      +' data-date="'+esc(r.work_date)+'"'
      +' data-cust="'+esc(r.customer_name)+'"'
      +' data-prod="'+esc(r.item_name)+'"'
      +' data-partno="'+esc(r.item_number)+'"'
      +' data-eq="'+esc(r.equipment_name)+'"'
      +' data-eqno="'+esc(r.equipment_number || "")+'"'
      +' data-dbinput="'+dbInput+'"'
      +' data-dbgood="'+dbGood+'"'
      +' data-dbbad="'+dbBad+'">'
      +'<td style="white-space:nowrap;font-size:11px;">'+esc(r.work_date)+'</td>'
      +'<td>'+esc(r.customer_name)+'</td>'
      +'<td>'+esc(r.item_name)+'</td>'
      +'<td>'+esc(r.item_number)+'</td>'
      +'<td class="td-db">'+dbInput.toLocaleString()+'</td>'
      +'<td class="td-db">'+dbGood.toLocaleString()+'</td>'
      +'<td class="td-db">'+dbBad.toLocaleString()+'</td>'
      +DEFECT_TYPES.map(function(type){ return makeInput(idx,type,r[type]); }).join("")
      +'<td class="td-calc" id="c-sum-'+idx+'">'+badSum.toLocaleString()+'</td>'
      +'<td class="'+(ppm>0 ? "td-calc-bad" : "td-calc")+'" id="c-ppm-'+idx+'">'+ppm.toLocaleString()+'</td>'
      +'<td class="defect-note-cell" title="'+esc(r.defect_content || "")+'">'+esc(r.defect_content || "-")+'</td>'
      +'<td><button class="save-btn" id="sbtn-'+idx+'" type="button" onclick="saveRow('+idx+')">저장</button></td>'
      +'</tr>';
  }).join("");

  document.getElementById("tbody").innerHTML = html;
  updateDash();
}

function makeInput(idx,field,val){
  const v = toN(val);
  return '<td><input class="td-input" type="number" min="0" step="1" value="'+v+'"'
    +' data-field="'+esc(field)+'" data-idx="'+idx+'"'
    +' oninput="markModified(this);recalc('+idx+')"></td>';
}

function markModified(el){
  el.classList.add("modified");
}

function getDefectValue(tr,field){
  const el = tr.querySelector('[data-field="'+field+'"]');
  return el ? toN(el.value) : 0;
}

function recalc(idx){
  const tr = document.querySelector('tr[data-idx="'+idx+'"]');
  if(!tr) return;

  const badSum = DEFECT_TYPES.reduce(function(sum,type){
    return sum + getDefectValue(tr,type);
  },0);

  const dbInput = toN(tr.dataset.dbinput);
  const ppm = dbInput > 0 ? Math.round(badSum/dbInput*1000000) : 0;
  const sEl = document.getElementById("c-sum-"+idx);
  const pEl = document.getElementById("c-ppm-"+idx);

  if(sEl) sEl.textContent = badSum.toLocaleString();
  if(pEl){
    pEl.textContent = ppm.toLocaleString();
    pEl.className = ppm > 0 ? "td-calc-bad" : "td-calc";
  }
}

function updateDash(){
  const trs = document.querySelectorAll("#tbody tr[data-idx]");
  let totInput = 0;
  let totGood = 0;
  let totBad = 0;

  trs.forEach(function(tr){
    totInput += toN(tr.dataset.dbinput);
    totGood += toN(tr.dataset.dbgood);
    totBad += toN(tr.dataset.dbbad);
  });

  const ppm = totInput > 0 ? Math.round(totBad/totInput*1000000) : 0;
  const isOk = ppm === 0;

  document.getElementById("dInput").innerHTML =
    totInput.toLocaleString()+'<span class="kpi-unit">ea</span>';
  document.getElementById("dGood").innerHTML =
    totGood.toLocaleString()+'<span class="kpi-unit">ea</span>';
  document.getElementById("dBad").innerHTML =
    totBad.toLocaleString()+'<span class="kpi-unit">ea</span>';

  const pEl = document.getElementById("dPpm");
  pEl.innerHTML = ppm.toLocaleString()+'<span class="kpi-unit">PPM</span>';
  pEl.style.color = isOk ? "var(--green-dk)" : "var(--red)";
  document.getElementById("dPpmCard").style.background =
    isOk ? "var(--green-lt)" : "var(--red-lt)";
}

async function saveRow(idx){
  if(!currentProfile){
    showToast("로그인 회사 정보를 확인할 수 없습니다.");
    return;
  }

  const tr = document.querySelector('tr[data-idx="'+idx+'"]');
  const btn = document.getElementById("sbtn-"+idx);
  if(!tr || !btn) return;

  const productionId = tr.dataset.id;
  if(!productionId){
    showToast("저장 대상의 내부 식별값이 없습니다.");
    return;
  }

  const quantities = {};
  let invalidType = "";

  DEFECT_TYPES.forEach(function(type){
    const input = tr.querySelector('[data-field="'+type+'"]');
    const raw = input ? String(input.value || "").trim() : "0";
    const numberValue = raw === "" ? 0 : Number(raw);

    if(
      !Number.isFinite(numberValue) ||
      numberValue < 0 ||
      !Number.isInteger(numberValue)
    ){
      invalidType = type;
      return;
    }

    quantities[type] = numberValue;
  });

  if(invalidType){
    showToast(invalidType+" 불량수량은 0 이상의 정수로 입력해 주세요.");
    return;
  }

  const badSum = DEFECT_TYPES.reduce(function(sum,type){
    return sum + quantities[type];
  },0);

  const inputQuantity = toN(tr.dataset.dbinput);

  if(badSum > inputQuantity){
    showToast("불량합계("+badSum.toLocaleString()+")는 투입수량("+inputQuantity.toLocaleString()+")보다 클 수 없습니다.");
    return;
  }

  const goodQuantity = inputQuantity-badSum;

  const detailRows = DEFECT_TYPES
    .filter(function(type){
      return quantities[type] > 0;
    })
    .map(function(type){
      return {
        company_id: currentProfile.company_id,
        production_system_id: productionId,
        defect_type: type,
        defect_quantity: quantities[type],
        is_active: true
      };
    });

  btn.classList.add("saving");
  btn.textContent = "저장중";
  setStatus("loading","불량유형 저장 중...");
  showLoading("불량유형을 저장하는 중입니다...");

  try{
    const {error:deleteDetailError} = await sb
      .from(DEFECT_TABLE)
      .delete()
      .eq("company_id",currentProfile.company_id)
      .eq("production_system_id",productionId);

    if(deleteDetailError) throw deleteDetailError;

    if(detailRows.length > 0){
      const {error:detailError} = await sb
        .from(DEFECT_TABLE)
        .insert(detailRows);

      if(detailError) throw detailError;
    }

    const {data:updatedProduction,error:productionError} = await sb
      .from(PRODUCTION_TABLE)
      .update({
        defect_quantity: badSum,
        good_quantity: goodQuantity
      })
      .eq("production_system_id",productionId)
      .eq("company_id",currentProfile.company_id)
      .select("production_system_id")
      .maybeSingle();

    if(productionError) throw productionError;
    if(!updatedProduction){
      throw new Error("생산실적 수정 대상이 없거나 회사 권한으로 수정할 수 없습니다.");
    }

    tr.dataset.dbbad = String(badSum);
    tr.dataset.dbgood = String(goodQuantity);

    const dbCells = tr.querySelectorAll("td.td-db");
    if(dbCells[0]) dbCells[0].textContent = inputQuantity.toLocaleString();
    if(dbCells[1]) dbCells[1].textContent = goodQuantity.toLocaleString();
    if(dbCells[2]) dbCells[2].textContent = badSum.toLocaleString();

    const ppm = inputQuantity > 0 ? Math.round(badSum/inputQuantity*1000000) : 0;
    const pEl = document.getElementById("c-ppm-"+idx);
    if(pEl){
      pEl.textContent = ppm.toLocaleString();
      pEl.className = ppm > 0 ? "td-calc-bad" : "td-calc";
    }

    tr.querySelectorAll(".modified").forEach(function(el){
      el.classList.remove("modified");
    });

    btn.classList.remove("saving");
    btn.classList.add("saved");
    btn.textContent = "완료";

    updateDash();
    setStatus("ok","저장 완료: "+tr.dataset.date+" "+tr.dataset.cust);
    showToast("저장 완료: "+tr.dataset.date+" "+tr.dataset.cust);

    setTimeout(function(){
      btn.classList.remove("saved");
      btn.textContent = "저장";
    },2500);
  }catch(error){
    console.error(error);
    btn.classList.remove("saving");
    btn.textContent = "저장";
    setStatus("error","저장 실패: "+dbErrorMessage(error));
    showToast("저장 실패: "+dbErrorMessage(error));
  }finally{
    hideLoading();
  }
}

function csvEscape(value){
  const s = String(value == null ? "" : value);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function exportCSV(){
  const rows = document.querySelectorAll("#tbody tr[data-idx]");
  if(rows.length === 0){
    showToast("내보낼 데이터가 없습니다.");
    return;
  }

  const headers = [
    "작업일","고객사","품명","품번",
    "투입수량(DB)","양품수량(DB)","불량수량(DB)",
    "외관","융착","찍힘","탈락","경도","변형",
    "불량합계","불량률(PPM)","불량내용"
  ];

  const lines = [headers.map(csvEscape).join(",")];

  rows.forEach(function(tr){
    const idx = tr.dataset.idx;
    const cells = [
      tr.dataset.date,
      tr.dataset.cust,
      tr.dataset.prod,
      tr.dataset.partno,
      tr.dataset.dbinput,
      tr.dataset.dbgood,
      tr.dataset.dbbad
    ];

    DEFECT_TYPES.forEach(function(type){
      cells.push(getDefectValue(tr,type));
    });

    cells.push(
      document.getElementById("c-sum-"+idx).textContent.replace(/,/g,""),
      document.getElementById("c-ppm-"+idx).textContent.replace(/,/g,""),
      queryRows[Number(idx)] ? (queryRows[Number(idx)].defect_content || "") : ""
    );

    lines.push(cells.map(csvEscape).join(","));
  });

  const blob = new Blob(["\uFEFF"+lines.join("\r\n")],{
    type:"text/csv;charset=utf-8;"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const from = document.getElementById("fFrom").value || "";
  const to = document.getElementById("fTo").value || "";

  a.href = url;
  a.download = "Defect_Rate_"+from+"_"+to+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  setStatus("ok","CSV 내보내기 완료");
  showToast("CSV 내보내기를 완료했습니다.");
}

function getPdfCellText(tr, selector, fallback){
  const el = tr.querySelector(selector);
  if(!el) return fallback || "";
  if(el.matches("input,select")) return el.value || "";
  const input = el.querySelector("input,select");
  return input ? (input.value || "") : (el.textContent || "").trim();
}

async function exportPDF(){
  const rows = Array.from(document.querySelectorAll("#tbody tr[data-idx]"));
  if(rows.length === 0){
    showToast("PDF로 저장할 데이터가 없습니다.");
    return;
  }

  const btn = document.getElementById("btnPdf");
  const originalText = btn.textContent;
  const printRoot = document.getElementById("pdfPrintRoot");
  const from = document.getElementById("fFrom").value || "";
  const to = document.getElementById("fTo").value || "";
  const periodText = from && to ? from+" ~ "+to : (from || to || "조회기간 전체");

  btn.disabled = true;
  btn.textContent = "PDF 생성 중...";
  showLoading("A4 가로형 PDF를 생성하는 중입니다...");
  setStatus("loading","PDF 생성 중...");

  try{
    const pdf = new window.jspdf.jsPDF({
      orientation:"landscape",
      unit:"mm",
      format:"a4"
    });

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 6;
    const maxWidth = pageWidth - margin * 2;
    const maxHeight = pageHeight - margin * 2;

    /* 첫 페이지는 KPI 포함, 다음 페이지는 표 가독성을 위해 행 수를 조금 늘림 */
    const firstPageCount = 17;
    const nextPageCount = 23;
    const pageChunks = [];

    if(rows.length <= firstPageCount){
      pageChunks.push(rows);
    }else{
      pageChunks.push(rows.slice(0,firstPageCount));
      for(let i=firstPageCount;i<rows.length;i+=nextPageCount){
        pageChunks.push(rows.slice(i,i+nextPageCount));
      }
    }

    const totalPages = pageChunks.length;

    for(let pageIndex=0;pageIndex<totalPages;pageIndex++){
      const pageRows = pageChunks[pageIndex];
      const pageDiv = document.createElement("div");
      pageDiv.className = "pdf-page";

      pageDiv.innerHTML = `
        <div class="pdf-main-title">불량률 현황</div>
        <div class="pdf-period">조회기간: ${esc(periodText)}</div>
        ${pageIndex === 0 ? buildPdfKpiHtml() : ""}
        <div class="pdf-section-title">
          <span>불량 내역</span>
          <span>${rows.length.toLocaleString()}건</span>
        </div>
        <table class="pdf-table">
          ${buildPdfTableHeader()}
          <tbody>
            ${pageRows.map(buildPdfTableRow).join("")}
          </tbody>
        </table>
        <div class="pdf-page-number">${pageIndex+1} / ${totalPages} 페이지</div>`;

      printRoot.appendChild(pageDiv);

      const canvas = await html2canvas(pageDiv,{
        scale:2,
        backgroundColor:"#ffffff",
        useCORS:true,
        logging:false
      });

      const ratio = Math.min(maxWidth/canvas.width,maxHeight/canvas.height);
      const renderWidth = canvas.width * ratio;
      const renderHeight = canvas.height * ratio;
      const x = (pageWidth-renderWidth)/2;
      const y = margin;

      if(pageIndex > 0) pdf.addPage();

      pdf.addImage(
        canvas.toDataURL("image/png"),
        "PNG",
        x,
        y,
        renderWidth,
        renderHeight
      );

      printRoot.removeChild(pageDiv);
    }

    pdf.save("Defect_Rate_"+from+"_"+to+".pdf");
    setStatus("ok","PDF 다운로드 완료");
    showToast("KPI와 불량내역 PDF 다운로드를 완료했습니다.");
  }catch(error){
    console.error(error);
    printRoot.innerHTML = "";
    setStatus("error","PDF 생성 실패: "+dbErrorMessage(error));
    showToast("PDF 생성 실패: "+dbErrorMessage(error));
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
    hideLoading();
  }
}
