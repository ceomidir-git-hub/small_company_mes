<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월생산달성율 | HeatPro MES</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background: #f0f2f5; color: #222; min-height: 100vh; }
.top-bar { background: #1a3a5c; color: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.top-bar h1 { font-size: clamp(14px,2vw,20px); font-weight: 700; letter-spacing: 1px; }
.top-bar .sub { font-size: clamp(11px,1.2vw,13px); opacity: 0.75; }
.search-panel { background: #fff; border-bottom: 2px solid #1a3a5c; padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search-panel label { font-size: 13px; font-weight: 600; color: #1a3a5c; }
.search-panel select { padding: 5px 10px; border: 1px solid #aaa; border-radius: 4px; font-size: 13px; font-family: inherit; }
.btn-search { background: #1a3a5c; color: #fff; border: none; padding: 6px 18px; border-radius: 4px; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600; }
.btn-search:hover { background: #2a5a8c; }
.btn-csv { background: #1d7a3c; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600; }
.btn-csv:hover { background: #259a4c; }
.btn-pdf { background: #b3261e; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600; }
.btn-pdf:hover { background: #d83a30; }
.btn-pdf:disabled, .btn-csv:disabled, .btn-search:disabled { background: #999; cursor: default; }
.action-status { min-height: 18px; font-size: 12px; font-weight: 600; color: #555; }
.action-status.success { color: #1d7a3c; }
.action-status.error { color: #b3261e; }
.container { padding: 16px; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
.card-title { background: #1a3a5c; color: #fff; padding: 8px 16px; font-size: clamp(13px,1.5vw,15px); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.card-title .target { font-size: 12px; font-weight: 400; opacity: 0.85; }
.card-body { padding: 12px; }
.chart-wrap { position: relative; width: 100%; height: clamp(200px,30vw,320px); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: clamp(10px,1.1vw,13px); min-width: 1000px; }
th, td { border: 1px solid #ccc; text-align: center; padding: 4px 3px; white-space: nowrap; }
thead th { background: #1a3a5c; color: #fff; font-weight: 600; }
.th-holiday { color: #ff2222 !important; font-weight: 700 !important; }
.td-holiday { background: #fff5f5 !important; }
.th-none { background: #cccccc !important; color: #999 !important; }
.td-none { background: #eeeeee !important; color: #bbb !important; }
td.col-label { background: #f5f7fa; font-weight: 600; color: #1a3a5c; }
td.col-group { background: #e8ecf5; font-weight: 700; color: #1a3a5c; }
td.col-sub   { background: #f5f7fa; font-weight: 600; color: #1a3a5c; }
td.total-col { background: #fff8e1 !important; font-weight: 700; color: #333; }
tr.row-diff td { color: #1a3a5c; }
tr.row-rate td { color: #cc0000; font-weight: 700; }
.legend { display: flex; gap: 16px; font-size: 11px; margin-bottom: 8px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.legend-dot.holiday { background: #ff2222; }
.legend-dot.none { background: #cccccc; }
.status-box { text-align: center; padding: 40px; color: #888; font-size: 14px; }
.status-box.error { color: #c00; }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #1a3a5c; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="top-bar">
  <h1>📊 월생산달성율 (Monthly Production Achievement)</h1>
  <span class="sub">HeatPro MES · AUTO-GENERATED DOCUMENTS · ISO 9001</span>
</div>

<div class="search-panel">
  <label>조회 월 :</label>
  <select id="selYear" aria-label="조회 연도">
    <option value="2026" selected>2026년</option>
    <option value="2027">2027년</option>
  </select>
  <select id="selMonth" aria-label="조회 월">
    <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
    <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
    <option value="7" selected>7월</option><option value="8">8월</option><option value="9">9월</option>
    <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
  </select>
  <button class="btn-search" type="button" onclick="loadData()">조 회</button>
  <button class="btn-csv" type="button" onclick="exportCSV()">⬇ CSV</button>
  <button class="btn-pdf" type="button" onclick="exportPDF()">⬇ PDF</button>
  <span id="actionStatus" class="action-status" role="status" aria-live="polite"></span>
</div>

<div class="container">
  <div class="card">
    <div class="card-title">
      <span id="chartTitle">생산실적 달성율 현황 ( 2026년 7월 )</span>
      <span class="target">[목표 : 90%]</span>
    </div>
    <div class="card-body">
      <div class="chart-wrap"><canvas id="myChart"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">월별 생산실적 상세</div>
    <div class="card-body">
      <div class="legend">
        <div class="legend-item"><span class="legend-dot holiday"></span><span>토요일 · 일요일 · 공휴일</span></div>
        <div class="legend-item"><span class="legend-dot none"></span><span>해당 월 없는 날짜</span></div>
      </div>
      <div id="tableArea" class="tbl-wrap">
        <div class="status-box"><div class="spinner"></div><br>데이터를 불러오는 중입니다...</div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   Supabase / 멀티테넌트 설정
   ========================================================= */
const SUPABASE_URL = "https://enxtgbyslnryxvfpjdkc.supabase.co";
const SUPABASE_KEY = "sb_publishable_9w9ktk0x4D8I6QodkWOthA_4FcxzMwD";
const TABLE_NAME = "Total_Production_DB";
const LOGIN_PAGE_URL = "./index.html";

const TARGET = 90;
const MAX_DAYS = 31;
const PAGE_SIZE = 1000;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

let currentUser = null;
let currentProfile = null;
let currentYear = 2026;
let currentMonth = 7;
let myChart = null;
let lastData = null;

/*
 * 토요일·일요일은 날짜 계산으로 처리합니다.
 * 아래 배열은 평일 공휴일 및 휴일 표시를 위한 날짜입니다.
 */
const HOLIDAYS = new Set([
  // 2026년
  "2026-01-01",
  "2026-02-16", "2026-02-17", "2026-02-18",
  "2026-03-01", "2026-03-02",
  "2026-05-01", "2026-05-05", "2026-05-25",
  "2026-06-03", "2026-06-06",
  "2026-07-17",
  "2026-08-15", "2026-08-17",
  "2026-09-24", "2026-09-25", "2026-09-26",
  "2026-10-03", "2026-10-05", "2026-10-09",
  "2026-12-25",

  // 2027년
  "2027-01-01",
  "2027-02-06", "2027-02-07", "2027-02-08", "2027-02-09",
  "2027-03-01",
  "2027-05-01", "2027-05-03", "2027-05-05", "2027-05-13",
  "2027-06-06",
  "2027-07-17", "2027-07-19",
  "2027-08-15", "2027-08-16",
  "2027-09-14", "2027-09-15", "2027-09-16",
  "2027-10-03", "2027-10-04", "2027-10-09", "2027-10-11",
  "2027-12-25", "2027-12-27"
]);

function redirectToLogin() {
  window.location.replace(LOGIN_PAGE_URL);
}

async function verifyCompanyAccess() {
  const { data: userData, error: userError } = await sb.auth.getUser();
  const user = userData && userData.user;

  if (userError || !user) {
    redirectToLogin();
    return false;
  }

  const { data: profile, error: profileError } = await sb
    .from("profiles")
    .select("company_id,is_active")
    .eq("user_id", user.id)
    .single();

  if (
    profileError ||
    !profile ||
    profile.is_active !== true ||
    !profile.company_id
  ) {
    console.error("회사 권한 확인 실패:", profileError);
    await sb.auth.signOut({ scope: "local" });
    redirectToLogin();
    return false;
  }

  currentUser = user;
  currentProfile = profile;
  return true;
}

sb.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_OUT") redirectToLogin();
});

function setActionStatus(message, type) {
  const el = document.getElementById("actionStatus");
  el.textContent = message || "";
  el.className = "action-status" + (type ? " " + type : "");
}

function setButtonsDisabled(disabled) {
  document.querySelectorAll(".btn-search,.btn-csv,.btn-pdf").forEach((button) => {
    button.disabled = disabled;
  });
}

function getDaysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function getDow(year, month, day) {
  return new Date(year, month - 1, day).getDay();
}

function dateKey(year, month, day) {
  return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
}

function isHoliday(year, month, day) {
  const dow = getDow(year, month, day);
  return dow === 0 || dow === 6 || HOLIDAYS.has(dateKey(year, month, day));
}

function toNumber(value) {
  const number = Number(String(value == null ? "" : value).replace(/,/g, ""));
  return Number.isFinite(number) ? number : 0;
}

function monthStart(year, month) {
  return year + "-" + String(month).padStart(2, "0") + "-01";
}

function nextMonthStart(year, month) {
  if (month === 12) return (year + 1) + "-01-01";
  return year + "-" + String(month + 1).padStart(2, "0") + "-01";
}

async function fetchMonthlyRows(year, month) {
  const rows = [];
  let from = 0;

  while (true) {
    const { data, error } = await sb
      .from(TABLE_NAME)
      .select("work_date,planned_quantity,input_quantity,good_quantity,defect_quantity")
      .eq("company_id", currentProfile.company_id)
      .eq("is_active", true)
      .gte("work_date", monthStart(year, month))
      .lt("work_date", nextMonthStart(year, month))
      .order("work_date", { ascending: true })
      .range(from, from + PAGE_SIZE - 1);

    if (error) throw error;

    const page = data || [];
    rows.push(...page);

    if (page.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }

  return rows;
}

async function loadData() {
  if (!currentProfile) return;

  currentYear = Number(document.getElementById("selYear").value);
  currentMonth = Number(document.getElementById("selMonth").value);

  if (![2026, 2027].includes(currentYear) || currentMonth < 1 || currentMonth > 12) {
    showError("조회 연도와 월을 확인해 주세요.");
    setActionStatus("조회 실패: 조회 조건을 확인해 주세요.", "error");
    return;
  }

  document.getElementById("chartTitle").textContent =
    "생산실적 달성율 현황 ( " + currentYear + "년 " + currentMonth + "월 )";

  document.getElementById("tableArea").innerHTML =
    '<div class="status-box"><div class="spinner"></div><br>데이터를 불러오는 중입니다...</div>';

  setButtonsDisabled(true);
  setActionStatus("조회 중입니다.", "");

  try {
    const rows = await fetchMonthlyRows(currentYear, currentMonth);
    processData(rows, currentYear, currentMonth);
    setActionStatus(
      "조회 완료: " + currentYear + "년 " + currentMonth + "월 " + rows.length.toLocaleString() + "건",
      "success"
    );
  } catch (error) {
    console.error("월생산실적 조회 실패:", error);
    lastData = null;
    showError(error && error.message ? error.message : "데이터 조회에 실패했습니다.");
    setActionStatus("조회 실패: 데이터베이스 연결을 확인해 주세요.", "error");
  } finally {
    setButtonsDisabled(false);
  }
}

function showError(message) {
  document.getElementById("tableArea").innerHTML =
    '<div class="status-box error">⚠️ ' + escapeHtml(message) + "</div>";
}

function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function processData(rows, year, month) {
  const actualDays = getDaysInMonth(year, month);
  const planArr = Array(MAX_DAYS).fill(0);
  const inputArr = Array(MAX_DAYS).fill(0);
  const resultArr = Array(MAX_DAYS).fill(0);

  rows.forEach((row) => {
    if (!row.work_date) return;

    const parts = String(row.work_date).split("-");
    if (parts.length < 3) return;

    const rowYear = Number(parts[0]);
    const rowMonth = Number(parts[1]);
    const day = Number(parts[2]);

    if (rowYear !== year || rowMonth !== month || day < 1 || day > actualDays) return;

    const index = day - 1;
    planArr[index] += toNumber(row.planned_quantity);
    inputArr[index] += toNumber(row.input_quantity);
    resultArr[index] += toNumber(row.good_quantity) + toNumber(row.defect_quantity);
  });

  const totalPlan = planArr.slice(0, actualDays).reduce((sum, value) => sum + value, 0);
  const totalInput = inputArr.slice(0, actualDays).reduce((sum, value) => sum + value, 0);
  const totalResult = resultArr.slice(0, actualDays).reduce((sum, value) => sum + value, 0);
  const totalDiff = totalInput - totalResult;
  const totalRate = totalPlan > 0
    ? Math.round((totalResult / totalPlan) * 1000) / 10
    : null;

  const diffArr = [];
  const rateArr = [];

  for (let index = 0; index < MAX_DAYS; index += 1) {
    if (index >= actualDays) {
      diffArr.push(null);
      rateArr.push(null);
      continue;
    }

    diffArr.push(inputArr[index] - resultArr[index]);
    rateArr.push(
      planArr[index] > 0
        ? Math.round((resultArr[index] / planArr[index]) * 1000) / 10
        : null
    );
  }

  lastData = {
    year,
    month,
    actualDays,
    planArr,
    inputArr,
    resultArr,
    diffArr,
    rateArr,
    totalPlan,
    totalInput,
    totalResult,
    totalDiff,
    totalRate
  };

  renderChart(actualDays, rateArr, resultArr);
  renderTable(
    actualDays,
    year,
    month,
    planArr,
    inputArr,
    resultArr,
    diffArr,
    rateArr,
    totalPlan,
    totalInput,
    totalResult,
    totalDiff,
    totalRate
  );
}

function renderChart(actualDays, rateArr, resultArr) {
  const labels = [];
  const rateData = [];
  const targetData = [];
  const barData = [];

  for (let index = 0; index < MAX_DAYS; index += 1) {
    labels.push(index < actualDays ? String(index + 1) : "");
    rateData.push(index < actualDays && rateArr[index] !== null ? rateArr[index] : undefined);
    targetData.push(index < actualDays ? TARGET : undefined);
    barData.push(index < actualDays && resultArr[index] > 0 ? resultArr[index] : undefined);
  }

  if (myChart) myChart.destroy();

  const context = document.getElementById("myChart").getContext("2d");
  myChart = new Chart(context, {
    type: "bar",
    data: {
      labels,
      datasets: [
        {
          type: "bar",
          label: "생산실적(ea)",
          data: barData,
          backgroundColor: "rgba(26,90,140,0.5)",
          borderColor: "rgba(26,90,140,0.8)",
          borderWidth: 1,
          yAxisID: "y2",
          order: 2
        },
        {
          type: "line",
          label: "달성율(%)",
          data: rateData,
          borderColor: "#cc0000",
          backgroundColor: "rgba(204,0,0,0.05)",
          borderWidth: 2,
          pointBackgroundColor: "#cc0000",
          pointRadius: 4,
          pointHoverRadius: 6,
          tension: 0,
          spanGaps: false,
          yAxisID: "y",
          order: 1
        },
        {
          type: "line",
          label: "목표(" + TARGET + "%)",
          data: targetData,
          borderColor: "#aaa",
          borderWidth: 1,
          borderDash: [6, 3],
          pointRadius: 0,
          tension: 0,
          yAxisID: "y",
          order: 3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", labels: { font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label(context) {
              if (context.dataset.label === "생산실적(ea)") {
                return context.dataset.label + ": " +
                  (context.parsed.y !== undefined
                    ? Number(context.parsed.y).toLocaleString() + "ea"
                    : "-");
              }
              return context.dataset.label + ": " +
                (context.parsed.y !== undefined ? context.parsed.y + "%" : "-");
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: "일(Day)", font: { size: 11 } },
          ticks: { font: { size: 10 } },
          grid: { color: "#eee" }
        },
        y: {
          position: "right",
          min: 0,
          suggestedMax: 120,
          title: { display: true, text: "달성율(%)", font: { size: 11 } },
          ticks: {
            font: { size: 10 },
            callback(value) { return value + "%"; }
          },
          grid: { color: "#eee" }
        },
        y2: {
          position: "left",
          min: 0,
          title: { display: true, text: "생산실적(ea)", font: { size: 11 } },
          ticks: {
            font: { size: 10 },
            callback(value) { return Number(value).toLocaleString(); }
          },
          grid: { drawOnChartArea: false }
        }
      }
    },
    plugins: [{
      id: "valueLabels",
      afterDatasetsDraw(chart) {
        const chartContext = chart.ctx;
        chartContext.save();
        chartContext.textAlign = "center";

        const barDataset = chart.data.datasets[0];
        const barMeta = chart.getDatasetMeta(0);
        chartContext.font = "bold 10px Malgun Gothic";
        chartContext.fillStyle = "rgba(26,90,140,0.9)";
        barMeta.data.forEach((bar, index) => {
          const value = barDataset.data[index];
          if (value !== undefined && value !== null) {
            chartContext.fillText(Number(value).toLocaleString(), bar.x, bar.y - 5);
          }
        });

        const lineDataset = chart.data.datasets[1];
        const lineMeta = chart.getDatasetMeta(1);
        chartContext.font = "bold 10px Malgun Gothic";
        chartContext.fillStyle = "#cc0000";
        lineMeta.data.forEach((point, index) => {
          const value = lineDataset.data[index];
          if (value !== undefined && value !== null) {
            chartContext.fillText(value + "%", point.x, point.y - 8);
          }
        });

        chartContext.restore();
      }
    }]
  });
}

function renderTable(
  actualDays,
  year,
  month,
  planArr,
  inputArr,
  resultArr,
  diffArr,
  rateArr,
  totalPlan,
  totalInput,
  totalResult,
  totalDiff,
  totalRate
) {
  const formatQuantity = (value) =>
    value === null || value === undefined || value === 0
      ? ""
      : Number(value).toLocaleString();

  const formatRate = (value) =>
    value === null || value === undefined ? "" : value + "%";

  let header = '<th colspan="2">구분</th><th class="total-col" style="color:#fff;">합계</th>';

  for (let day = 1; day <= MAX_DAYS; day += 1) {
    if (day <= actualDays) {
      const className = isHoliday(year, month, day) ? "th-holiday" : "";
      header += '<th class="' + className + '">' + day + "</th>";
    } else {
      header += '<th class="th-none">' + day + "</th>";
    }
  }

  function dataCells(values, total, isRate) {
    let cells = '<td class="total-col">' +
      (isRate ? formatRate(total) : formatQuantity(total)) +
      "</td>";

    for (let index = 0; index < MAX_DAYS; index += 1) {
      const day = index + 1;

      if (index < actualDays) {
        const hasProduction = resultArr[index] > 0;
        const className = isHoliday(year, month, day) && !hasProduction ? "td-holiday" : "";
        cells += '<td class="' + className + '">' +
          (isRate ? formatRate(values[index]) : formatQuantity(values[index])) +
          "</td>";
      } else {
        cells += '<td class="td-none"></td>';
      }
    }

    return cells;
  }

  function makeRow(label, values, total, isRate) {
    return '<tr><td class="col-label" colspan="2">' + label + "</td>" +
      dataCells(values, total, isRate) +
      "</tr>";
  }

  let resultRows = "";
  resultRows += '<tr>' +
    '<td class="col-group" rowspan="3">실적</td>' +
    '<td class="col-sub">생산실적</td>' +
    dataCells(resultArr, totalResult, false) +
    "</tr>";

  resultRows += '<tr class="row-diff">' +
    '<td class="col-sub">차이</td>' +
    dataCells(diffArr, totalDiff, false) +
    "</tr>";

  resultRows += '<tr class="row-rate">' +
    '<td class="col-sub">달성율(%)</td>' +
    dataCells(rateArr, totalRate, true) +
    "</tr>";

  let tableHtml = "<table><thead><tr>" + header + "</tr></thead><tbody>";
  tableHtml += makeRow("월간생산계획", planArr, totalPlan, false);
  tableHtml += makeRow("생산계획", inputArr, totalInput, false);
  tableHtml += resultRows;
  tableHtml += "</tbody></table>";

  document.getElementById("tableArea").innerHTML = tableHtml;
}

function exportCSV() {
  if (!lastData) {
    setActionStatus("CSV 저장 실패: 먼저 조회를 진행해 주세요.", "error");
    return;
  }

  try {
    const data = lastData;
    const formatQuantity = (value) =>
      value === null || value === undefined || value === 0 ? "" : String(value);
    const formatRate = (value) =>
      value === null || value === undefined ? "" : String(value);

    const rows = [];
    const header = ["구분", "합계"];
    for (let day = 1; day <= MAX_DAYS; day += 1) header.push(day + "일");
    rows.push(header);

    function buildRow(label, values, total, isRate) {
      const row = [label, isRate ? formatRate(total) : formatQuantity(total)];

      for (let index = 0; index < MAX_DAYS; index += 1) {
        if (index < data.actualDays) {
          row.push(isRate ? formatRate(values[index]) : formatQuantity(values[index]));
        } else {
          row.push("");
        }
      }

      return row;
    }

    rows.push(buildRow("월간생산계획", data.planArr, data.totalPlan, false));
    rows.push(buildRow("생산계획", data.inputArr, data.totalInput, false));
    rows.push(buildRow("생산실적", data.resultArr, data.totalResult, false));
    rows.push(buildRow("차이", data.diffArr, data.totalDiff, false));
    rows.push(buildRow("달성율(%)", data.rateArr, data.totalRate, true));

    const csv = rows.map((row) => row.map((cell) => {
      let value = String(cell);
      if (value.includes(",") || value.includes('"') || value.includes("\n")) {
        value = '"' + value.replace(/"/g, '""') + '"';
      }
      return value;
    }).join(",")).join("\r\n");

    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = "월생산달성율_" + data.year + "년_" + data.month + "월.csv";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    URL.revokeObjectURL(url);

    setActionStatus("CSV 저장을 완료했습니다.", "success");
  } catch (error) {
    console.error("CSV 저장 실패:", error);
    setActionStatus("CSV 저장 실패: " + error.message, "error");
  }
}

async function exportPDF() {
  if (!lastData) {
    setActionStatus("PDF 저장 실패: 먼저 조회를 진행해 주세요.", "error");
    return;
  }

  const button = document.querySelector(".btn-pdf");
  const originalText = button.textContent;
  button.textContent = "생성 중...";
  setButtonsDisabled(true);
  setActionStatus("PDF를 생성하는 중입니다.", "");

  try {
    const target = document.querySelector(".container");
    const canvas = await html2canvas(target, {
      scale: 2,
      backgroundColor: "#ffffff",
      useCORS: true
    });

    const imageData = canvas.toDataURL("image/png");
    const JsPdf = window.jspdf.jsPDF;
    const pdf = new JsPdf({ orientation: "landscape", unit: "mm", format: "a4" });

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 8;
    const maxWidth = pageWidth - margin * 2;
    const maxHeight = pageHeight - margin * 2;
    const ratio = Math.min(maxWidth / canvas.width, maxHeight / canvas.height);
    const renderWidth = canvas.width * ratio;
    const renderHeight = canvas.height * ratio;
    const x = (pageWidth - renderWidth) / 2;

    pdf.addImage(imageData, "PNG", x, margin, renderWidth, renderHeight);
    pdf.save("월생산달성율_" + lastData.year + "년_" + lastData.month + "월.pdf");

    setActionStatus("PDF 저장을 완료했습니다.", "success");
  } catch (error) {
    console.error("PDF 생성 실패:", error);
    setActionStatus("PDF 저장 실패: " + error.message, "error");
  } finally {
    button.textContent = originalText;
    setButtonsDisabled(false);
  }
}

async function initializePage() {
  const now = new Date();
  const year = [2026, 2027].includes(now.getFullYear()) ? now.getFullYear() : 2026;
  const month = now.getMonth() + 1;

  document.getElementById("selYear").value = String(year);
  document.getElementById("selMonth").value = String(month);

  const allowed = await verifyCompanyAccess();
  if (!allowed) return;

  await loadData();
}

window.addEventListener("load", initializePage);
